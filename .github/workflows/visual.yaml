name: visual

# Dark (report-only) visual-regression + a11y gate.
# Intentionally NOT a required check: failures here surface drift for review
# without blocking merges. Baselines under tests/visual/__screenshots__.
# Promote to required once baselines are stable across runner generations.
# rm-207 (cycle-17, 2026-09-25): the fixture server serves `public/` (the
# ~3k-line operator runtime) and `web/dist/` built from `web/` — the paths
# filter must cover every non-test surface that reaches the browser, else
# visually-material changes skip this gate entirely. `test/visual-gate-paths.test.ts`
# pins this coverage set.
on:
  pull_request:
    paths:
      - web/src/**
      - web/index.html
      - web/privacy.html
      - web/public/**
      - web/vite.config.ts
      - public/**
      - tests/visual/**
      - playwright.config.ts
      - .github/workflows/visual.yaml
      # rm-420 (renumbered from rm-208 at the 2026-09-25 ci-gate merge, then
      # from rm-223 at the 2026-10-03 integrate — main's landed ledger owns
      # rm-223 for the DASHBOARD_MONITORING_REFRESH gate): render inputs
      # beyond web/src. package.json + pnpm-lock.yaml pin the dependency
      # versions that ship the rendered bundle — a dep bump can shift rendered
      # output without touching web/src, and must still run the visual gate.
      # Guarded by test/visual-trigger-paths.test.ts. web/index.html and
      # web/vite.config.ts were deduped here (both lineages had added them).
      - package.json
      - pnpm-lock.yaml
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update-baselines:
        description: Run with --update-snapshots and upload new baselines
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    # rm-188 (cycle 13, 2026-09-25): pinned ubuntu-24.04 — ubuntu-26.04 images are
    # published while the ubuntu-latest alias still maps to 24.04; re-evaluate
    # at the rm-139 Node-26 window (2026-10-28).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Deterministic render environment (rm-142): the pinned Playwright image
    # bundles the chromium build that matches the @playwright/test 1.64.0 pin,
    # so baselines render identically across runner generations. The rolling
    # ubuntu-latest + runtime `playwright install` mix already reddened this
    # gate once (run 35678222963, cloud font stack vs workstation-captured
    # baselines). No runtime browser-install step belongs below: browsers live
    # at /ms-playwright inside the image (PLAYWRIGHT_BROWSERS_PATH preset).
    # Digest-pinned (not just tag-pinned): a mutable tag can be re-pushed
    # under the same version, silently changing the render environment and
    # invalidating baselines — the digest makes the compare environment
    # bit-identical forever. Dependabot (docker ecosystem) owns bumping the
    # tag+digest pair together; on landing, regenerate all baselines in the
    # new image (see the provenance spec in the rm-142 acceptance).
    # 2026-10-17 (integration conflict case 87241f2e, run 1c814809d084):
    # re-pin v1.63.0-noble -> v1.64.0-noble. The lockfile's @playwright/test
    # had drifted in-range to 1.64.0 (6179cb7's regen under package.json's
    # ^1.63.0 range) while this image stayed at 1.63.0, so every post-Oct-11
    # visual run died at browser launch — "Executable doesn't exist at
    # /ms-playwright/chromium_headless_shell-1248/..." (e.g. run 38963562396,
    # the failure that opened the case). Tag+digest moved together per the
    # rm-142 doctrine; this digest is the one validated green in run
    # 38963773814. Only the operator baseline needed regeneration
    # (listener/privacy matched pixel-identical across the chromium builds) —
    # provenance header in tests/visual/dashboard.spec.ts.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm via pnpm/action-setup (repo convention, see .github/actions/setup).
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium ships with the container image (see the container block above) —
      # the old `pnpm exec playwright install chromium --with-deps` step is
      # deliberately absent: installing on top of the pinned image would
      # reintroduce exactly the environment drift this job exists to prevent.

      - name: Run visual-regression + axe suite
        run: >
          pnpm exec playwright test
          ${{ (github.event_name == 'workflow_dispatch' && inputs.update-baselines) && '--update-snapshots' || '' }}
        env:
          UPDATE_BASELINES: ${{ (github.event_name == 'workflow_dispatch' && inputs.update-baselines) && 'true' || 'false' }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload baselines (update mode)
        if: github.event_name == 'workflow_dispatch' && inputs.update-baselines
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/
          retention-days: 14
