name: visual

# Dark (report-only) visual-regression + a11y gate.
# Intentionally NOT a required check: failures here surface drift for review
# without blocking merges. Baselines under tests/visual/__screenshots__.
# Promote to required once baselines are stable across runner generations.
on:
  pull_request:
    paths:
      - web/src/**
      - tests/visual/**
      - playwright.config.ts
      - .github/workflows/visual.yaml
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update-baselines:
        description: Run with --update-snapshots and upload new baselines
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm via pnpm/action-setup (repo convention, see .github/actions/setup):
      # self-hosted runners run unprivileged, so `corepack enable` fails with
      # EACCES symlinking into /usr/bin.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run visual-regression + axe suite
        run: >
          pnpm exec playwright test
          ${{ (github.event_name == 'workflow_dispatch' && inputs.update-baselines) && '--update-snapshots' || '' }}
        env:
          UPDATE_BASELINES: ${{ (github.event_name == 'workflow_dispatch' && inputs.update-baselines) && 'true' || 'false' }}

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload baselines (update mode)
        if: github.event_name == 'workflow_dispatch' && inputs.update-baselines
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__/
          retention-days: 14
