# Standing residue sweep — rm-159's automation half (landed 2026-10-06,
# conductor run 00f7bf29 implement 75ed284e). The conductor/ci-* validation
# ref population grows monotonically (44 on 2026-09-24 -> 49 on 2026-10-06
# of 123 conductor refs) while the manual one-shot sweep of the original
# acceptance was exercised zero times since mint, and reaped full_tests
# sessions can strand open PRs whose head ref was deleted mid-check-wait
# (the #390 dangling-head class). This workflow converts that debt into a
# standing, safe-by-default sweep.
#
# Safety shape (rm-159's extended acceptance):
#   - dry-run by DEFAULT: scheduled fires and an unmodified dispatch only
#     LOG every ref/PR they would touch; the destructive half runs only via
#     workflow_dispatch with dry-run=false, normalized at runtime to the
#     exact trimmed lower-case literal 'false' (review 52e54b5b F3: 'True',
#     'FALSE ', 'yes', '', or any UI/API string-coercion shape stays DRY).
#   - 14-day age floor on both refs (tip committerdate) and PRs (createdAt)
#     — in-flight validations are far younger.
#   - every conductor/run-* ref is deliberately PRESERVED: that namespace
#     is the delivered-vanished recovery stratum, never swept regardless of
#     age. Unknown other conductor/ namespaces are kept and logged, not
#     deleted.
#   - PRs close BEFORE refs delete, so a close can never mint a new
#     dangling head.
name: Residue Sweep

on:
  schedule:
    - cron: '37 5 * * 2' # Tuesdays 05:37 UTC — off the Monday scheduled pile (audit 03:37Z, base-drift 04:13Z, canary 05:23Z, scorecard 06:27Z)
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Log the sweep plan without touching anything (live sweep: false)'
        required: false
        default: 'true'
      older-than-days:
        description: 'Minimum age in days of conductor/ci-* refs and PRs before they are swept'
        required: false
        default: '14'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: residue-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep stale conductor/ci-* residue
    # rm-188-era pin (2026-09-25): ubuntu-24.04, not ubuntu-latest — the
    # alias still maps to 24.04; re-evaluate at the rm-139 Node-26 window
    # (2026-10-28).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        # persist-credentials is explicitly ON (rm-527 wants the key present
        # and deliberate): the live sweep pushes ref deletions with the
        # workflow token under contents: 'write'.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Fetch conductor refs
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/conductor/*:refs/remotes/origin/conductor/*'

      - name: Sweep stale conductor/ci-* refs and superseded ephemeral PRs
        env:
          GH_TOKEN: ${{ github.token }}
          # Scheduled fires carry no inputs (empty string normalizes to
          # DRY); LIVE requires an explicit dispatch with dry-run exactly
          # 'false' (review 52e54b5b F3: the old `|| 'true'` made a
          # UI-unchecked boolean false stringify and silently stay dry
          # with no live path).
          DRY_RUN: ${{ inputs.dry-run }}
          OLDER_THAN_DAYS: ${{ inputs.older-than-days || '14' }}
        run: |
          set -euo pipefail

          # F3 (review 52e54b5b): LIVE requires the exact literal 'false'
          # after trim + lower-case — every other shape stays DRY (fail closed).
          DRY_RUN="$(printf '%s' "$DRY_RUN" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ "$DRY_RUN" != 'false' ]; then DRY_RUN='true'; fi

          days="$OLDER_THAN_DAYS"
          if ! [[ "$days" =~ ^[1-9][0-9]*$ ]]; then
            echo "::warning::invalid older-than-days '$days' — falling back to 14"
            days=14
          fi
          cutoff=$(( $(date +%s) - days * 86400 ))
          verb=deleted
          [ "$DRY_RUN" = 'false' ] || verb='DRY-RUN: would delete'
          echo "mode: dry-run=$DRY_RUN, floor: refs/PRs older than $days days (before $(date -u -d "@$cutoff" --iso-8601=seconds))"

          # 1. Close superseded ephemeral PRs FIRST — deleting a head ref
          #    before its PR closes is how dangling heads get minted.
          closed=0
          while IFS="$(printf '\t')" read -r num head created; do
            [ -n "$num" ] || continue
            if [ "$(date -u -d "$created" +%s)" -ge "$cutoff" ]; then
              echo "keep PR #$num (head $head) — under the floor"
              continue
            fi
            if [ "$DRY_RUN" != 'false' ]; then
              echo "DRY-RUN: would close PR #$num (head $head, opened $created)"
            else
              gh pr close "$num" --repo "$GITHUB_REPOSITORY" \
                --comment "Closed by the residue sweep: the ephemeral conductor/ci-* validation branch behind this PR is past the ${days}-day floor (rm-159). Content that mattered has landed or is carried by a newer validation PR."
              echo "closed PR #$num (head $head)"
            fi
            closed=$((closed + 1))
          done < <(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 300 \
            --json number,headRefName,createdAt \
            --jq '.[] | select(.headRefName | startswith("conductor/ci-")) | [.number, .headRefName, .createdAt] | @tsv')

          # 2. Sweep stale refs. conductor/run-* is PRESERVED unconditionally
          #    (delivered-vanished recovery stratum); anything outside
          #    conductor/ci-* (which glob-covers conductor/ci-base-*) is kept
          #    and logged, never deleted.
          swept=0
          kept=0
          while read -r ts ref; do
            # F4 (review 52e54b5b): a malformed census line (blank or short
            # — a ref deleted between census and resolution) must SKIP with
            # a log line, not kill the job under set -e via date -d / [ -ge ].
            case "$ts" in ''|*[!0-9]*)
              echo "skip malformed census line (ts='$ts' ref='$ref')"
              continue
              ;;
            esac
            short="${ref#refs/remotes/origin/}"
            age="$(date -u -d "@$ts" --iso-8601=seconds)"
            case "$short" in
              conductor/run-*)
                echo "PRESERVED $short (run stratum, tip $age)"
                kept=$((kept + 1))
                continue
                ;;
              conductor/ci-*)
                ;;
              *)
                echo "keep $short (non-ci namespace, tip $age)"
                kept=$((kept + 1))
                continue
                ;;
            esac
            if [ "$ts" -ge "$cutoff" ]; then
              echo "keep $short (tip $age) — under the floor"
              kept=$((kept + 1))
              continue
            fi
            echo "$verb ref $short (tip $age)"
            if [ "$DRY_RUN" = 'false' ]; then
              git push origin --delete "$short"
            fi
            swept=$((swept + 1))
          # rm-166 forbids the literal '--format' string anywhere in
          # workflow text (a buildx digest-readback trap), so read refs via
          # for-each-ref's default '<sha> <type> TAB <ref>' lines and resolve
          # the tip committerdate per ref with git log --pretty instead.
          done < <(
            git for-each-ref --sort=refname 'refs/remotes/origin/conductor/*' |
              while read -r _ _ ref; do
                [ -n "$ref" ] || continue
                printf '%s %s\n' "$(git log -1 --pretty=%ct "$ref")" "$ref"
              done
          )

          pr_verb=closed
          [ "$DRY_RUN" = 'false' ] || pr_verb='would close'
          echo "sweep summary: $swept ref(s) $verb, $closed PR(s) $pr_verb, $kept kept/preserved"
          if [ "$DRY_RUN" != 'false' ]; then
            echo 'dry-run complete — nothing touched. Dispatch with dry-run=false to execute.'
          fi
