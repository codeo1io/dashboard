---
name: CodeQL

on:
  pull_request:
    branches: [main, 'conductor/ci-base-**']
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '31 7 * * 3' # Every Wednesday at 7:31am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    # rm-188 (cycle 13, 2026-09-25): pinned ubuntu-24.04 — ubuntu-26.04 images are
    # published while the ubuntu-latest alias still maps to 24.04; re-evaluate
    # at the rm-139 Node-26 window (2026-10-28).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    env:
      # 2026-09-20 (ci fix): CodeQL's bundled typescript-parser-wrapper resolves
      # 'typescript' via this override or a bare require from the _tool cache
      # path (no node_modules anywhere up that tree on this runner). Upstream
      # passes on hosted runners where the wrapper resolves on its own; here
      # autobuild never sets the override, so point it at the repo-installed
      # typescript (pinned toolchain, installed by the Setup step below).
      SEMMLE_TYPESCRIPT_HOME: ${{ github.workspace }}/node_modules/typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 2026-09-20: autobuild under build-mode none needs node_modules/typescript
      # (this repo has no `main` entrypoint), and checkout's git-clean wipes
      # node_modules — install deps before codeql-init so autobuild finds the
      # toolchain. Also feeds SEMMLE_TYPESCRIPT_HOME (job env above) with the
      # pinned typescript.
      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
