---
name: CodeQL

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'conductor/ci-base-**'] # base-image drift branches push CodeQL baselines too (lost in the 2026.10.43 adoption merge; re-restored 2026-10-18)
  schedule:
    - cron: '31 7 * * 3' # Every Wednesday at 7:31am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04 # 2026-09-20: pinned runner (rm-188) to decouple from default-fleet churn.
    timeout-minutes: 20 # 2026-09-20 (rm-603): bound analysis runs (360m default is excessive). Both lost in the 2026.10.43 adoption merge; re-restored 2026-10-18 (rm-1520).
    permissions:
      contents: read
      security-events: write
    env:
      # 2026-09-30 (rm-771): Override the CodeQL standard library location to the
      # preinstalled TypeScript toolchain extracted by the Setup composite, so
      # autobuild resolution matches the local toolchain.
      SEMMLE_TYPESCRIPT_HOME: /opt/hostedtoolcache/node

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5fd0b1b161c4e20ea4c16c8725711bfdf # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
