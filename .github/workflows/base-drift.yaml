# Weekly read-only drift check for the Dockerfile's node:24-slim base pins.
#
# The Dockerfile pins by digest (never a moving tag), so nothing alerts when
# the upstream tag rebuilds. This workflow compares the pinned digests to the
# live tag digest every Monday and opens an issue on drift — it never bumps
# anything (auto-bumping a base image would skip the Release scan gate).
#
# Digest parsing uses the manifest pretty-dump `Digest:` line, NOT
# `docker buildx imagetools inspect --format '{{.Manifest.Digest}}'` — that
# template is silently ignored for attestation-bearing OCI indexes and prints
# the full default dump instead (see docs/solutions/, Release workflow fix).
name: Base image drift check

on:
  schedule:
    - cron: '13 4 * * 1' # Mondays 04:13 UTC, off the hour
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift:
    # 2026-09-22: ubuntu-latest per the hosted-runner CI policy (PR #11/#12)
    # — this file was authored under the retired self-hosted-only policy.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare Dockerfile pins to live node:24-slim digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # rm-177: the live digest MUST be extracted, not assumed. On 2026-09-24
          # (run 35970747110) `docker manifest inspect` returned no Digest line
          # (exited 0 under anonymous manifest-auth rate limiting), the empty
          # string compared unequal to the pin, and the job redded on a
          # non-drift. Extraction failure is NOT drift and must never produce
          # a drift verdict.
          extract_live_digest() {
            local d
            d="$(docker manifest inspect node:24-slim 2>/dev/null | awk '/^Digest:/{print $2; exit}' || true)"
            if [ -n "$d" ]; then
              printf '%s' "$d"
              return 0
            fi
            echo '::warning::docker manifest inspect returned no Digest line — trying Docker Hub token + registry HEAD fallback' >&2
            # Fallback (proven 2026-09-24, research b27ad37b): anonymous token
            # from auth.docker.io, then a registry HEAD whose
            # docker-content-digest header is the live digest.
            local token
            token="$(curl -fsSL --max-time 20 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/node:pull' \
              | jq -r '.token // empty' 2>/dev/null || true)"
            if [ -n "$token" ]; then
              d="$(curl -fsSI --max-time 20 \
                -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                'https://registry-1.docker.io/v2/library/node/manifests/24-slim' \
                | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2; exit}' || true)"
              if [ -n "$d" ]; then
                printf '%s' "$d"
                return 0
              fi
            fi
            return 1
          }

          LIVE_DIGEST=""
          if ! LIVE_DIGEST="$(extract_live_digest)"; then
            echo '::error::live digest EXTRACTION FAILED (empty) — this is an extraction failure, NOT drift. docker manifest inspect returned no Digest line and the auth.docker.io/registry-1.docker.io HEAD fallback also failed. Re-run this workflow before drawing any drift conclusion.'
            exit 1
          fi
          echo "live node:24-slim digest: $LIVE_DIGEST"

          PINNED="$(grep -oE 'sha256:[0-9a-f]{64}' Dockerfile | sort -u)"
          if [ -z "$PINNED" ]; then
            echo '::error::no pinned digests found in Dockerfile'
            exit 1
          fi
          echo "pinned digests:"
          echo "$PINNED"

          DRIFT=0
          for pin in $PINNED; do
            if [ "$pin" != "$LIVE_DIGEST" ]; then
              echo "drift: pin $pin != live $LIVE_DIGEST"
              DRIFT=1
            else
              echo "current: $pin"
            fi
          done

          if [ "$DRIFT" = '0' ]; then
            echo 'no drift — Dockerfile is current'
            exit 0
          fi

          # Surface the drift as a tracking issue (deduplicated while one is
          # open). Best-effort only: issues are DISABLED on this fork
          # (has_issues=false → the issue API 410s), and under set -euo pipefail
          # an unguarded gh issue call would exit the step red with a
          # misleading error. The unconditional exit 1 below is the
          # authoritative drift signal (rm-123).
          ISSUES_ENABLED="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_issues' 2>/dev/null || echo 'false')"
          if [ "$ISSUES_ENABLED" = 'true' ]; then
            # Surface the drift as an issue (deduplicated while one is open).
            gh label create base-image-drift --color BFD4F2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            OPEN="$(gh issue list --repo "$GITHUB_REPOSITORY" --label base-image-drift --state open --json number --jq 'length')"
            if [ "$OPEN" = '0' ]; then
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --label base-image-drift \
                --title 'Base image drift: Dockerfile pins behind node:24-slim' \
                --body "The weekly drift check found pinned digests that no longer match the live \`node:24-slim\` tag.

            Live digest: \`$LIVE_DIGEST\`
            Pinned digests (from \`Dockerfile\`):
            \`\`\`
            $PINNED
            \`\`\`

            Action: re-pin in a PR that goes through the normal Release scan gate. Do not auto-bump." >/dev/null
            else
              echo "open drift issue already exists ($OPEN) — skipping creation"
            fi
          else
            echo '::warning::issues disabled on this repository — drift tracking issue skipped; the red run is the drift signal'
          fi

          # Non-zero so the run is visibly red on drift.
          exit 1
