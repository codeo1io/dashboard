# Weekly read-only drift check for the Dockerfile's node:24-slim base pins.
#
# The Dockerfile pins by digest (never a moving tag), so nothing alerts when
# the upstream tag rebuilds. This workflow compares the pinned digests to the
# live tag digest every Monday and opens an issue on drift — it never bumps
# anything (auto-bumping a base image would skip the Release scan gate).
#
# Digest probing uses the raw registry HTTP API via curl — daemon- and
# plugin-independent — because BOTH docker CLI forms are broken on
# GitHub-hosted runners (measured 2026-09-24, run c2ae28ab ci):
#   * `docker buildx imagetools inspect` exits 255 instantly and silently on
#     hosted runners (2/2 deterministic; the earlier container-digest doc's
#     guidance assumed the workstation, where it works).
#   * `docker manifest inspect <ref>` (non-verbose) emits the raw index JSON,
#     which has no top-level `Digest:` line at all — the awk extraction yields
#     empty and every pin then reads as drift (false-red; run 35970747110).
#   * `docker manifest inspect --verbose` prints a platform list with no
#     top-level descriptor digest either.
# The HTTP path: bearer token from auth.docker.io, then HEAD the manifest
# endpoint with index Accept headers and read the `Docker-Content-Digest`
# response header — the same digest every client reports.
name: Base image drift check

on:
  schedule:
    - cron: '13 4 * * 1' # Mondays 04:13 UTC, off the hour
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift:
    # 2026-09-22: ubuntu-latest per the hosted-runner CI policy (PR #11/#12)
    # — this file was authored under the retired self-hosted-only policy.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare Dockerfile pins to live node:24-slim digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TOKEN="$(curl -fsSL 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/node:pull' | jq -r .token)" || {
            echo '::error::registry auth failed (auth.docker.io token fetch) — a probe failure is not drift and must not be reported as one'
            exit 1
          }
          if [ -z "$TOKEN" ] || [ "$TOKEN" = 'null' ]; then
            echo '::error::registry auth returned no token'
            exit 1
          fi

          LIVE_DIGEST="$(
            curl -fsSI \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              'https://registry-1.docker.io/v2/library/node/manifests/24-slim' \
              | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2; exit}'
          )" || {
            echo '::error::registry manifest probe failed (registry-1.docker.io HEAD) — a probe failure is not drift and must not be reported as one'
            exit 1
          }
          if [ -z "$LIVE_DIGEST" ]; then
            echo '::error::probe succeeded but no Docker-Content-Digest header came back — refusing to compare against an empty live digest'
            exit 1
          fi
          echo "live node:24-slim index digest: $LIVE_DIGEST"

          PINNED="$(grep -oE 'sha256:[0-9a-f]{64}' Dockerfile | sort -u)"
          if [ -z "$PINNED" ]; then
            echo '::error::no pinned digests found in Dockerfile'
            exit 1
          fi
          echo "pinned digests:"
          echo "$PINNED"

          DRIFT=0
          for pin in $PINNED; do
            if [ "$pin" != "$LIVE_DIGEST" ]; then
              echo "drift: pin $pin != live $LIVE_DIGEST"
              DRIFT=1
            else
              echo "current: $pin"
            fi
          done

          if [ "$DRIFT" = '0' ]; then
            echo 'no drift — Dockerfile is current'
            exit 0
          fi

          # Surface the drift as a tracking issue (deduplicated while one is
          # open). Best-effort only: issues are DISABLED on this fork
          # (has_issues=false → the issue API 410s), and under set -euo pipefail
          # an unguarded gh issue call would exit the step red with a
          # misleading error. The unconditional exit 1 below is the
          # authoritative drift signal (rm-123).
          ISSUES_ENABLED="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_issues' 2>/dev/null || echo 'false')"
          if [ "$ISSUES_ENABLED" = 'true' ]; then
            # Surface the drift as an issue (deduplicated while one is open).
            gh label create base-image-drift --color BFD4F2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            OPEN="$(gh issue list --repo "$GITHUB_REPOSITORY" --label base-image-drift --state open --json number --jq 'length')"
            if [ "$OPEN" = '0' ]; then
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --label base-image-drift \
                --title 'Base image drift: Dockerfile pins behind node:24-slim' \
                --body "The weekly drift check found pinned digests that no longer match the live \`node:24-slim\` tag.

            Live digest: \`$LIVE_DIGEST\`
            Pinned digests (from \`Dockerfile\`):
            \`\`\`
            $PINNED
            \`\`\`

            Action: re-pin in a PR that goes through the normal Release scan gate. Do not auto-bump." >/dev/null
            else
              echo "open drift issue already exists ($OPEN) — skipping creation"
            fi
          else
            echo '::warning::issues disabled on this repository — drift tracking issue skipped; the red run is the drift signal'
          fi

          # Non-zero so the run is visibly red on drift.
          exit 1
