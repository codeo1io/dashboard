# Weekly read-only drift check for the Dockerfile's node:24-slim base pins,
# plus a report-only pin-drift job (rm-204) covering packageManager, npm
# ranges, and GitHub Action pins — drift the digest job cannot see.
#
# The Dockerfile pins by digest (never a moving tag), so nothing alerts when
# the upstream tag rebuilds. This workflow compares the pinned digests to the
# live tag digest every Monday and opens an issue on drift — it never bumps
# anything (auto-bumping a base image would skip the Release scan gate).
#
# Digest readback contract (rm-166, rm-178, rm-182 — three 2026-09-24 runs
# converged on this same repair):
#   - Use `docker buildx imagetools inspect <ref>` — its pretty dump prints a
#     `Digest: <sha256:...>` header line the awk below can parse.
#   - NEVER `docker manifest inspect` here: plain `manifest inspect` prints the
#     raw manifest JSON with NO `Digest:` header, so the awk returns EMPTY and
#     every pin "drifts" against "" — a guaranteed weekly false red (run
#     35970747110; the pre-fix gate ran 4/4 false-red). This is the #3317
#     lesson transposed to the wrong subcommand: the buildx
#     `--format '{{.Manifest.Digest}}'` template is silently IGNORED for
#     attestation-bearing OCI indexes, so the Digest:-line + awk form (as in
#     release.yaml) is the only readback proven on both runner classes.
#   - An empty LIVE_DIGEST is a readback ERROR, never a drift verdict: guarded
#     explicitly below (fail loud on the tool, not the base image).
#   - rm-182 (run 5b6e8e801952 cycle:1 B1, integrated 2026-09-24) adds the
#     fallback for the anonymous-CLI rate-limit failure class: when the buildx
#     dump yields no Digest: line, mint an anonymous token at auth.docker.io
#     and HEAD registry-1.docker.io for the docker-content-digest header
#     (proven 2026-09-24, research b27ad37b). Only failure of BOTH paths reds
#     — distinctly, as an extraction error, never a drift verdict.
name: Base image drift check

on:
  schedule:
    - cron: '13 4 * * 1' # Mondays 04:13 UTC, off the hour
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift:
    # 2026-09-22: ubuntu-latest per the hosted-runner CI policy (PR #11/#12)
    # — this file was authored under the retired self-hosted-only policy.
    # rm-188 (cycle 13, 2026-09-25): pinned ubuntu-24.04 — ubuntu-26.04 images are
    # published while the ubuntu-latest alias still maps to 24.04; re-evaluate
    # at the rm-139 Node-26 window (2026-10-28).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare Dockerfile pins to live node:24-slim digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Digest readback (rm-166/rm-178 — cycle-11/12 landed this buildx
          # primary; rm-182 — the third same-day convergence — adds the
          # anonymous-token + registry-HEAD fallback below). `|| true` INSIDE
          # each substitution so a CLI failure (e.g. anonymous manifest-auth
          # rate limiting) reaches the empty-digest guard instead of tripping
          # set -e first.
          LIVE_DIGEST="$(docker buildx imagetools inspect node:24-slim | awk '/^Digest:/{print $2; exit}' || true)"
          if [ -z "$LIVE_DIGEST" ]; then
            echo '::warning::buildx imagetools inspect yielded no Digest: line — trying the Docker Hub token + registry HEAD fallback (rm-182)'
            # Fallback (proven 2026-09-24, research b27ad37b): anonymous token
            # from auth.docker.io, then a registry HEAD whose
            # docker-content-digest header is the live digest.
            TOKEN="$(curl -fsSL --max-time 20 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/node:pull' \
              | jq -r '.token // empty' 2>/dev/null || true)"
            if [ -n "$TOKEN" ]; then
              LIVE_DIGEST="$(curl -fsSI --max-time 20 \
                -H "Authorization: Bearer $TOKEN" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                'https://registry-1.docker.io/v2/library/node/manifests/24-slim' \
                | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2; exit}' || true)"
            fi
          fi
          if [ -z "$LIVE_DIGEST" ]; then
            echo '::error::live digest EXTRACTION FAILED (empty) — this is a readback/extraction failure (rm-166/rm-178/rm-182), NOT drift: buildx imagetools inspect produced no Digest: line and the auth.docker.io/registry-1.docker.io HEAD fallback failed too. Re-run this workflow before drawing any drift conclusion.'
            exit 1
          fi
          echo "live node:24-slim digest: $LIVE_DIGEST"

          PINNED="$(grep -oE 'sha256:[0-9a-f]{64}' Dockerfile | sort -u)"
          if [ -z "$PINNED" ]; then
            echo '::error::no pinned digests found in Dockerfile'
            exit 1
          fi
          echo "pinned digests:"
          echo "$PINNED"

          DRIFT=0
          for pin in $PINNED; do
            if [ "$pin" != "$LIVE_DIGEST" ]; then
              echo "drift: pin $pin != live $LIVE_DIGEST"
              DRIFT=1
            else
              echo "current: $pin"
            fi
          done

          if [ "$DRIFT" = '0' ]; then
            echo 'no drift — Dockerfile is current'
            exit 0
          fi

          # Surface the drift as a tracking issue (deduplicated while one is
          # open). Best-effort only: issues are DISABLED on this fork
          # (has_issues=false → the issue API 410s), and under set -euo pipefail
          # an unguarded gh issue call would exit the step red with a
          # misleading error. The unconditional exit 1 below is the
          # authoritative drift signal (rm-123).
          ISSUES_ENABLED="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_issues' 2>/dev/null || echo 'false')"
          if [ "$ISSUES_ENABLED" = 'true' ]; then
            # Surface the drift as an issue (deduplicated while one is open).
            gh label create base-image-drift --color BFD4F2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
            OPEN="$(gh issue list --repo "$GITHUB_REPOSITORY" --label base-image-drift --state open --json number --jq 'length')"
            if [ "$OPEN" = '0' ]; then
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --label base-image-drift \
                --title 'Base image drift: Dockerfile pins behind node:24-slim' \
                --body "The weekly drift check found pinned digests that no longer match the live \`node:24-slim\` tag.

            Live digest: \`$LIVE_DIGEST\`
            Pinned digests (from \`Dockerfile\`):
            \`\`\`
            $PINNED
            \`\`\`

            Action: re-pin in a PR that goes through the normal Release scan gate. Do not auto-bump." >/dev/null
            else
              echo "open drift issue already exists ($OPEN) — skipping creation"
            fi
          else
            echo '::warning::issues disabled on this repository — drift tracking issue skipped; the red run is the drift signal'
          fi

          # Non-zero so the run is visibly red on drift.
          exit 1

  pin-drift:
    name: Dependency and action pin drift (report-only)
    # rm-204 (landing 2026-09-25, run a4a97e30 cycle-10 B2; minted as rm-167
    # in that lineage — renumbered at this integrate: main's landed rm-167
    # owns that id): surface pin drift the digest job cannot see. Never bumps
    # anything (dependabot is the sole pin-mover); chronic registry drift must
    # not turn a weekly watch red, so this job always exits 0 and reports
    # instead.
    # rm-188 (cycle 13): pinned ubuntu-24.04 with the digest job — the
    # ubuntu-latest alias maps to 24.04 while 26.04 images are published.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report packageManager pin vs upstream fro-bot/dashboard
        run: |
          set -euo pipefail
          SUMMARY="$GITHUB_STEP_SUMMARY"
          {
            echo '## Pin drift (report-only, rm-204)'
            echo '### packageManager'
          } >> "$SUMMARY"

          FORK_PIN="$(node -p "require('./package.json').packageManager")"
          UPSTREAM_PIN="$(curl -fsSL https://raw.githubusercontent.com/fro-bot/dashboard/main/package.json \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).packageManager" 2>/dev/null || true)"

          if [ -z "$UPSTREAM_PIN" ]; then
            echo '::warning::could not read upstream packageManager (network or layout change)'
            echo '- upstream lookup failed' >> "$SUMMARY"
          elif [ "$FORK_PIN" != "$UPSTREAM_PIN" ]; then
            echo "::warning::packageManager fork=$FORK_PIN upstream=$UPSTREAM_PIN"
            echo "- fork \`$FORK_PIN\` vs upstream \`$UPSTREAM_PIN\` — drift" >> "$SUMMARY"
          else
            echo "- fork \`$FORK_PIN\` matches upstream" >> "$SUMMARY"
          fi

      - name: Report npm dependencies vs registry latest
        run: |
          set -euo pipefail
          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo '### npm dependencies vs registry latest' >> "$SUMMARY"

          PKGS="$(node -e '
            const fs = require("fs");
            const out = new Set();
            for (const f of ["package.json", "web/package.json"]) {
              if (!fs.existsSync(f)) continue;
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              for (const dep of [p.dependencies, p.devDependencies]) {
                if (dep) Object.keys(dep).forEach((k) => out.add(k));
              }
            }
            console.log([...out].sort().join("\n"));
          ')"

          DRIFT=0
          MAJOR_PINNED=0
          TOTAL=0
          # npm view's range queries answer in npm's own text format — always
          # ask for --json and take the highest matching version from the array.
          resolve_range() {
            npm view "${1}@${2}" version --json 2>/dev/null | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d));
              process.stdin.on("end", () => {
                try {
                  const j = JSON.parse(s);
                  console.log(Array.isArray(j) ? j[j.length - 1] : j);
                } catch {
                  console.log("");
                }
              });
            '
          }
          major_of() { echo "$1" | grep -oE '^[0-9]+' || echo '?'; }
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            TOTAL=$((TOTAL + 1))
            PINNED="$(node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); console.log(p.dependencies?.['$pkg'] ?? p.devDependencies?.['$pkg'] ?? '?')")"
            LATEST="$(npm view "$pkg" version 2>/dev/null || true)"
            if [ -z "$LATEST" ]; then
              continue # private/local/unresolvable — not a drift signal
            fi
            # The lockfile is what ships, so compare the version the pinned
            # range RESOLVES to against registry latest — a range that already
            # resolves to latest is current, not drift.
            RESOLVED="$(resolve_range "$pkg" "$PINNED")"
            if [ -z "$RESOLVED" ] || [ "$RESOLVED" = "$LATEST" ]; then
              continue
            fi
            if [ "$(major_of "$RESOLVED")" -lt "$(major_of "$LATEST")" ] 2>/dev/null; then
              # Majors are deliberately pinned until a migration is planned
              # (rm-133) — report in the summary, but do not warn weekly.
              MAJOR_PINNED=$((MAJOR_PINNED + 1))
              echo "- \`$pkg\`: resolves \`$RESOLVED\`, latest major \`$LATEST\` — major pinned by design (rm-133)" >> "$SUMMARY"
            else
              DRIFT=$((DRIFT + 1))
              echo "::warning::$pkg resolves $RESOLVED (range $PINNED) vs latest $LATEST"
              echo "- \`$pkg\`: range \`$PINNED\` resolves \`$RESOLVED\` vs latest \`$LATEST\`" >> "$SUMMARY"
            fi
          done <<< "$PKGS"

          echo "checked $TOTAL packages, $DRIFT behind latest, $MAJOR_PINNED major-pinned by design"
          echo "checked: $TOTAL, behind latest: $DRIFT, major-pinned by design: $MAJOR_PINNED (rm-133) — dependabot owns the bumps (rm-102)" >> "$SUMMARY"

      - name: Report workflow action and image pins vs latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo '### GitHub Action and image pins' >> "$SUMMARY"

          # External action refs (owner/repo@ref) — local composite actions are
          # versioned with the repo itself and are skipped. The repo's pin
          # convention records the pinned version in a trailing '# vX.Y.Z'
          # comment on the uses: line; that comment is captured here and is
          # the AUTHORITY for sha pins (a sha never string-equals a tag, and
          # commit messages can carry unrelated semvers — e.g. build-push-action
          # shas resolve to a spurious 0.100.0). The commit-message fallback
          # below stays only for hypothetical comment-less sha pins and is
          # labelled as inferred. This also covers the fro-bot/agent action
          # pin (sha ref with the version in a trailing comment); mcr/playwright
          # image pins are by-design deterministic (deterministic visual gate)
          # and are not drift signals.
          ACTIONS="$(grep -rhoE 'uses: [A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[A-Za-z0-9_.-]+( +# *v?[A-Za-z0-9_.-]+)?' .github/workflows .github/actions \
            | sed 's/^uses: //' | sort -u || true)"

          report_action_pin() {
            local ref="$1" repo="$2" pinned="$3" latest resolved='' msg
            latest="$(gh api "repos/$repo/releases/latest" --jq .tag_name 2>/dev/null || true)"
            if [ -z "$latest" ]; then
              echo "- \`$repo@$ref\` — no releases (unresolvable)" >> "$SUMMARY"
              return
            fi
            # Release tags may or may not carry a leading v — compare without it.
            local latest_plain="${latest#v}"
            if [ -n "$pinned" ]; then
              # Trailing '# vX.Y.Z' comment — authoritative for this pin.
              if [ "${pinned#v}" = "$latest_plain" ]; then
                echo "- \`$repo@$pinned\` — current" >> "$SUMMARY"
              else
                echo "::warning::$repo pinned $pinned ($ref) vs latest $latest"
                echo "- \`$repo@$pinned\` ($ref) vs latest \`$latest\` — drift" >> "$SUMMARY"
              fi
            elif [[ "$ref" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              # Tag-pinned without a comment — the ref itself is the version.
              if [ "${ref#v}" = "$latest_plain" ]; then
                echo "- \`$repo@$ref\` — current" >> "$SUMMARY"
              else
                echo "::warning::$repo pinned $ref vs latest $latest"
                echo "- \`$repo@$ref\` vs latest \`$latest\` — drift" >> "$SUMMARY"
              fi
            else
              # Sha pin with no version comment — best-effort commit-message
              # resolution, labelled as inferred wherever it appears.
              msg="$(gh api "repos/$repo/commits/$ref" --jq .commit.message 2>/dev/null | head -1 || true)"
              resolved="$(echo "$msg" | grep -oE 'v?[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
              if [ -n "$resolved" ]; then
                if [ "${resolved#v}" = "$latest_plain" ]; then
                  echo "- \`$repo@$ref\` → $resolved (inferred) — current" >> "$SUMMARY"
                else
                  echo "::warning::$repo pinned ~$resolved (inferred from $ref) vs latest $latest"
                  echo "- \`$repo@$ref\` → $resolved (inferred) vs latest \`$latest\` — drift" >> "$SUMMARY"
                fi
              else
                echo "::warning::$repo pinned $ref (no version comment) vs latest $latest"
                echo "- \`$repo@$ref\` (no version comment) vs latest \`$latest\`" >> "$SUMMARY"
              fi
            fi
          }

          while IFS= read -r ref_line; do
            [ -n "$ref_line" ] || continue
            repo="${ref_line%%@*}"
            rest="${ref_line#*@}"
            ref="${rest%%[[:space:]]*}"
            pinned=''
            case "$rest" in
              *'#'*)
                pinned="${rest##*#}"
                pinned="${pinned# }"
                # Only a version-looking comment is authoritative.
                if ! [[ "$pinned" =~ ^v?[0-9][A-Za-z0-9_.-]*$ ]]; then
                  pinned=''
                fi
                ;;
            esac
            report_action_pin "$ref" "$repo" "$pinned"
          done <<< "$ACTIONS"

          echo 'report complete — action pins listed above; dependabot owns action bumps (rm-102)'
