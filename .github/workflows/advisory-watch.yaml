# rm-695 (repository-maintenance cycle 2, run bdc96578): advisory watch —
# weekly, alert-only, read-only. Turns the 2026-10-07 coincidental catch
# (run 018ca663 research: the fro-bot/agent v0.117.2..v0.118.1 release wave
# carried "Security" floor bumps — source-map-js 1.2.2, undici floors — that
# this repo absorbed the same day by luck, not by channel) into a designed
# channel: every Monday the watch reads fro-bot/agent's release notes
# published since the marker below and goes RED naming any Security /
# override-floor section that names a package present in this repo's
# pnpm-lock.yaml. It is a SIGNAL, never a gate: no pull_request/push
# triggers, never a required check (rm-116 must not key on it), read-only
# GITHUB_TOKEN, no install, no pnpm — Node alone.
#
# advisory-watch-marker: 2026-10-07
# ^ Everything published BEFORE this date is already dispositioned in the
# ROADMAP (research 018ca663 §1; the source-map-js floor raised in
# pnpm-workspace.yaml 2026-10-06). The script reads this marker from THIS
# file. After a red
# run is cured (raise the pin/floor + re-resolve pnpm-lock.yaml in the same
# change — the rm-276 convention — and disposition the signal in ROADMAP),
# bump the marker to the cure date. The window only grows between cures,
# which is the intended persistence: a signal stays red until dispositioned.
name: Advisory watch

on:
  schedule:
    - cron: '11 3 * * 1' # Mondays 03:11 UTC — ahead of the 03:37 audit.yaml slot
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  advisory-watch:
    name: Advisory watch
    # rm-188-era pin (2026-09-25): ubuntu-24.04, not ubuntu-latest — re-evaluate
    # at the rm-139 Node-26 window (2026-10-28).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-node-only shape (the canary's pre-install precedent): the watch
      # runs one dependency-free Node script — no pnpm, no install, nothing
      # from this repo's toolchain. Node 24 to match the repo floor.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # ADVISORY_RELEASES_FILE (absolute or repo-relative) replaces the live
      # fetch — it exists ONLY so the forced-red proof can run the verbatim
      # script against a fixture feed (see docs/prioritization
      # 2026-10-07-repository-maintenance-cycle-2-batch-run-bdc96578b0de.md).
      - name: Read advisory signals from fro-bot/agent releases
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          node <<'EOF'
          const {readFileSync} = require('node:fs')

          void (async () => {
            const workflowPath = '.github/workflows/advisory-watch.yaml'
            const workflowText = readFileSync(workflowPath, 'utf8')
            const marker = /# advisory-watch-marker: (\d{4}-\d{2}-\d{2})/.exec(workflowText)?.[1]
            if (!marker) {
              console.error(`no advisory-watch-marker comment in ${workflowPath} — the watch cannot window its scan`)
              process.exit(1)
            }

            const lockNames = (() => {
              const lines = readFileSync('pnpm-lock.yaml', 'utf8').split('\n')
              const names = new Set()
              let inPackages = false
              for (const line of lines) {
                if (/^\S/.test(line)) inPackages = line === 'packages:'
                if (!inPackages) continue
                const key = /^ {2}'?((?:@[^/@']+\/)?[^@':]+)@/.exec(line)
                if (key?.[1]) names.add(key[1])
              }
              return names
            })()

            const loadReleases = async () => {
              const fixture = process.env.ADVISORY_RELEASES_FILE
              if (fixture) return JSON.parse(readFileSync(fixture, 'utf8'))
              const headers = {
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'User-Agent': 'dashboard-advisory-watch',
              }
              if (process.env.GITHUB_API_TOKEN) headers.Authorization = `Bearer ${process.env.GITHUB_API_TOKEN}`
              const response = await fetch('https://api.github.com/repos/fro-bot/agent/releases?per_page=30', {headers})
              if (!response.ok) {
                console.error(`GitHub API ${response.status} — the watch fails closed rather than scan a stale window`)
                process.exit(1)
              }
              return response.json()
            }

            const releases = await loadReleases()
            const recent = releases.filter(
              (release) => !release.draft && (release.published_at ?? '') > `${marker}T00:00:00Z`,
            )
            const flags = []
            for (const release of recent) {
              const body = release.body ?? ''
              const sections = []
              let current = null
              for (const line of body.split('\n')) {
                if (/^#{1,6}\s/.test(line)) {
                  if (current) sections.push(current)
                  current = /security|override[- ]floor/i.test(line) ? {heading: line, lines: []} : null
                } else if (current) {
                  current.lines.push(line)
                }
              }
              if (current) sections.push(current)
              for (const section of sections) {
                const text = section.lines.join('\n')
                for (const name of lockNames) {
                  const pattern = new RegExp(`(^|[^\\w.-])${name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}([^\\w.-]|$)`)
                  if (pattern.test(text)) flags.push({tag: release.tag_name, name, heading: section.heading.trim()})
                }
              }
            }

            console.log(`marker ${marker} · ${lockNames.size} lockfile packages watched · ${recent.length} release(s) since marker`)
            if (flags.length > 0) {
              console.error('---')
              for (const flag of flags) {
                console.error(`⚠️  ${flag.tag} ${flag.heading}: names '${flag.name}', which is present in pnpm-lock.yaml`)
              }
              console.error('---')
              console.error('Cure per the rm-276 convention: raise the pin/floor and re-resolve pnpm-lock.yaml in the')
              console.error('same change, disposition the signal in ROADMAP (rm-695), then bump advisory-watch-marker.')
              process.exit(1)
            }
            console.log('no Security/override-floor section names a lockfile package — green')
          })().catch((error) => {
            console.error(error)
            process.exit(1)
          })
          EOF
