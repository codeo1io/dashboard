name: Release channel staleness check

# rm-740 — a silently dead release channel must be LOUD.
#
# Context (run 405e9004 assess F1, HIGH): this fork's durable release channel
# is half-dead by design today — `actions/secrets` is empty (total_count=0),
# so `HAS_RELEASE_APP` is false and release.yaml skips create-tag /
# promote-calver / create-GitHub-Release on every push; the live path is
# promote-latest only. Nothing alerts on that silence. This weekly check
# compares the newest FORK-REACHABLE calver tag (rm-1932: scoped via
# `git tag --merged origin/main` — foreign upstream tags fetched into this
# repo's tag namespace never feed the verdict; the summary names the
# exclusion count) against a stated 45-day threshold and goes RED when the
# channel is stale and not recorded-retired.
#
# The fog rm-714 dormancy decision is now RECORDED (2026-10-17, run
# b1949a6acc52 cycle-1 batch doc + docs/runbooks/release-channel-decision.json):
# retired:false — channel-of-record = the ABSORBED upstream release stream.
# This fork mints no releases of its own (release App secrets absent), so
# the newest calver tag REACHABLE from origin/main (the newest upstream
# release this fork has fully absorbed) IS the channel's newest output, and
# a red here is a REAL signal — the absorb stream itself has stalled past
# the threshold. It clears by absorbing a newer release (or by flipping the
# decision record to retired-with-owner in the file above), never by
# ignoring it; the step summary names rm-714 so the red is actionable.
#
# Reads only public refs (tags). No new secrets: the default GITHUB_TOKEN
# (contents: read) via actions/checkout is the only credential involved —
# fetch-depth: 0 brings the tags with the checkout's own credentials, so the
# script reads LOCAL refs only and performs no authenticated network access.
# issues: write is NOT granted — this workflow opens no issues (the red run
# itself is the signal, matching the upstream-drift.yaml alert-only posture).

on:
  schedule:
    # Weekly, Monday 07:23 UTC — off-hour vs the Monday cron cluster
    # (03:37 audit, 04:13 base-drift, 05:17 upstream-drift, 05:23 canary,
    # 06:27 scorecard, 06:53 cve-tripwire on main) — avoid contributing to a
    # simultaneous-failure cliff (rm-674 Monday-queue contention signals).
    - cron: '23 7 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  staleness:
    name: Evaluate release channel staleness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the tag set IS the evidence — a shallow checkout
          # without tags would make the check fail as extraction error, not
          # pass silently (rm-166 lesson).
          fetch-depth: 0
          persist-credentials: false

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: 🔍 Evaluate release channel staleness (rm-740)
        # Exit 0 = healthy or recorded-retired; 1 = stale (a REAL red since
        # the rm-714 branch-b decision was recorded 2026-10-17 — the absorb
        # stream stalled; retired:false does not suppress it); 2 = extraction
        # error (never a pass). Tier-1 scoping only: absorbed upstream
        # releases ARE the channel of record (rm-1932 header + decision
        # record); the branch-a fork-authored capability stays unwired. The
        # runner injects GITHUB_STEP_SUMMARY automatically — the script
        # appends the rm-740/rm-714 summary there.
        run: >-
          node scripts/release-channel-staleness.ts
          --base-ref origin/main
