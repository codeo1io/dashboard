---
name: Release

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - bun.lock
      - bunfig.toml
      # rm-154 (cycle-9): build-behavior config that changes image contents with
      # zero code diff — in the Bun world this lives in bunfig.toml (linker,
      # minimumReleaseAge, excludes) and bun.lock, all listed above.
      - 'tsconfig*.json'
      - 'src/**'
      - 'web/**'
      - 'public/**'
      - .github/workflows/release.yaml
      - scripts/should-release.ts
      - scripts/compute-release-tag.ts
      # rm-602 (conflict fa1b4af9): COPY'd into the builder stage and chained
      # into build:web — changes the shipped sidecar bytes with no src/web
      # diff. Paired in scripts/release-paths.ts (rm-154/rm-248 bidirectional
      # sync).
      - scripts/gzip-static-sidecars.ts
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}

    steps:
      - name: ⤵ Checkout (with history for push range)
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 🟢 Set up Node.js
        if: github.event_name == 'push'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: 🔍 Evaluate release gate
        id: check
        env:
          GITHUB_REF_NAME_FOR_LOG: ${{ github.ref }}
        run: |
          # workflow_dispatch: only release when triggered from main.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "Manual dispatch on main: releasing."
              echo "should-release=true" >> "$GITHUB_OUTPUT"
            else
              printf 'Manual dispatch on non-main ref (%s): skipping release.\n' "$GITHUB_REF_NAME_FOR_LOG"
              echo "should-release=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Collect all changed files across the entire pushed range.
          # github.event.before is the SHA before the push; github.sha is the tip.
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # First push to branch — all tracked files at HEAD are "new".
            echo "First push to branch — listing all tracked files as changed."
            CHANGED=$(git ls-files)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          fi
          echo "Changed files:"
          echo "$CHANGED"

          # Extract base package.json from the before commit
          BASE_PKG=$(mktemp)
          trap 'rm -f "$BASE_PKG"' EXIT
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # No parent commit — use an empty object as base
            echo '{}' > "$BASE_PKG"
          else
            if ! git show "${BEFORE}:package.json" > "$BASE_PKG" 2>/dev/null; then
              # package.json didn't exist in the before commit — use empty object
              echo '{}' > "$BASE_PKG"
            fi
          fi

          # Run the guard script
          if node scripts/should-release.ts \
              --changed-files "$CHANGED" \
              --base-pkg "$BASE_PKG" \
              --head-pkg package.json; then
            echo "should-release=true" >> "$GITHUB_OUTPUT"
          else
            EXIT=$?
            if [ "$EXIT" -eq 1 ]; then
              echo "should-release=false" >> "$GITHUB_OUTPUT"
            else
              echo "Guard script error (exit $EXIT)" >&2
              exit "$EXIT"
            fi
          fi

  release:
    name: Release
    needs: [guard]
    if: needs.guard.outputs.should-release == 'true'
    runs-on: ubuntu-24.04
    # rm-188 (cycle 13, 2026-09-25): pinned ubuntu-24.04 — ubuntu-26.04 images are
    # published while the ubuntu-latest alias still maps to 24.04; re-evaluate
    # at the rm-139 Node-26 window (2026-10-28).
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      # The secrets context is not available in step-level if: expressions (Actions
      # schema), so stage App-credential presence here. Fork repos without a release
      # App skip the App-gated publication steps with a warning — see the app-token
      # step below.
      HAS_RELEASE_APP: ${{ secrets.APPLICATION_ID != '' && secrets.APPLICATION_PRIVATE_KEY != '' }}
    outputs:
      tag: ${{ steps.calver.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: ⤵ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      # GHCR only accepts GITHUB_TOKEN (same-repo packages) or a classic PAT — NOT a
      # GitHub App installation token. The job's packages:write permission scopes this
      # GITHUB_TOKEN to push ghcr.io/<this repo>.
      - name: 🔑 Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # rm-882 (absorb of upstream #641, fork-adapted; landed on main via the
      # rm-1483 / 2026.10.43-adoption lineage, re-attributed at the 40bc52f7
      # integrate): compute the CalVer tag ONCE in the build job and stamp it
      # into the image (DASHBOARD_VERSION build-arg → VITE_DASHBOARD_VERSION →
      # footer version chip). The promote job then creates exactly that
      # precomputed tag — one computation, one create — instead of the old
      # 5-attempt re-compute race, which could tag a DIFFERENT version than
      # the one baked into the image it promotes. Pin kept at the repo's v7.1.0.
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: 🏷️ Compute release version
        id: version
        run: |
          git fetch --tags --force
          TAG="$(node scripts/compute-release-tag.ts)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # rm-558 review fix (independent_review 2026-10-04): the multi-arch
      # build's only target-executed step — the final-stage prune RUN — runs
      # on the arm64 target, and the ubuntu-24.04 runner image ships Docker /
      # Buildx with NO qemu/binfmt handlers. Without this step the arm64
      # target dies exec-format-error at that RUN (local builds only pass
      # because this host has binfmt-registered qemu).
      - name: 🐋 Set up QEMU (arm64 target emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: 🏗️ Build and push candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          # rm-558: multi-arch release. The Dockerfile's toolchain stages are
          # FROM --platform=$BUILDPLATFORM (shared/cache-hit across targets); each
          # target only re-COPYs the arch-independent artifacts and runs one ~1.2 s
          # prune rm (the only target-executed step). Measured locally at
          # 2026-10-04 (attempt 1599ea1e, delegate spool): shared toolchain build
          # 1m51s; linux/arm64 target adds 4.9s warm — vs a fully-QEMU-emulated
          # build of the pre-restructure Dockerfile whose single vite stage alone
          # took 84s. Expect near-zero CI-time delta vs the amd64-only baseline; if
          # the release run balloons, emulation of a toolchain stage crept into the
          # stage list (check the Dockerfile header comment).
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}-${{ github.run_attempt }}
          # rm-882: the precomputed CalVer tag rides into the image so the
          # footer chip and the promote-job tag can never disagree.
          build-args: |
            DASHBOARD_VERSION=${{ steps.version.outputs.tag }}
          # rm-105: registry-side supply-chain attestations. Provenance v1 ships
          # by default at mode=min; mode=max adds full materials/builder data and
          # sbom adds the SPDX attestation the image was missing (verified absent
          # on the pre-change :latest digest). See
          # docs/solutions/workflow-issues/registry-attestation-verification-2026-09-25.md
          sbom: true
          provenance: mode=max

      - name: 🧪 Smoke-test candidate image by digest
        run: |
          IMG="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          docker network create smoke-net
          COOKIE_KEY=$(openssl rand -hex 32)
          docker run -d --name dashboard-smoke --network smoke-net \
            -e DASHBOARD_COOKIE_KEY="$COOKIE_KEY" -e DASHBOARD_OPERATOR_LOGIN=smoke-test \
            -p 127.0.0.1:8080:3000 "$IMG"
          # poll host-published port (catches 127.0.0.1 bind regression)
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          # sibling-container reachability: run a throwaway container on the same smoke-net
          # network hitting the service by container name — mimics Caddy -> app over docker
          # network (catches a 127.0.0.1-only bind that passes the host-port poll but would
          # cause 502s from a reverse proxy reaching the app by service name).
          sib=0
          if docker run --rm --network smoke-net "$IMG" node -e \
              "fetch('http://dashboard-smoke:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" \
              >/dev/null 2>&1; then sib=1; fi
          if [ "$ok" != 1 ] || [ "$sib" != 1 ]; then
            echo "SMOKE FAILED (host_port_ok=$ok sibling_ok=$sib)"
            docker logs dashboard-smoke || true
            exit 1
          fi
          # Verify the SPA web/dist/ was built into the image and is served.
          # /manifest.webmanifest is a public (pre-auth) path — no cookie needed.
          spa=0
          if curl -fsS http://127.0.0.1:8080/manifest.webmanifest >/dev/null 2>&1; then spa=1; fi
          if [ "$spa" != 1 ]; then
            echo "SMOKE FAILED: SPA manifest not served (web/dist/ missing from image?)"
            docker logs dashboard-smoke || true
            exit 1
          fi
          # Verify CSP header is present and contains the pinned script-src 'self' directive.
          csp_ok=0
          CSP_HEADER=$(curl -fsS -I http://127.0.0.1:8080/api/healthz 2>/dev/null | tr -d '\r' | grep -i '^content-security-policy:' || true)
          if echo "$CSP_HEADER" | grep -q "script-src 'self'"; then csp_ok=1; fi
          if [ "$csp_ok" != 1 ]; then
            echo "SMOKE FAILED: CSP header missing or script-src 'self' not present"
            echo "CSP header: $CSP_HEADER"
            docker logs dashboard-smoke || true
            exit 1
          fi
          runtime_uid=$(docker run --rm "$IMG" node -p 'process.getuid()')
          runtime_env=$(docker run --rm "$IMG" node -p 'process.env.NODE_ENV')
          if [ "$runtime_uid" != 1000 ]; then
            echo "SMOKE FAILED: runtime UID is $runtime_uid, expected 1000"
            exit 1
          fi
          if [ "$runtime_env" != production ]; then
            echo "SMOKE FAILED: NODE_ENV is '$runtime_env', expected production"
            exit 1
          fi

          if ! docker run --rm --entrypoint sh "$IMG" -ec '
            for tool in npm npx pnpm pnpx corepack yarn yarnpkg bun bunx; do
              if command -v "$tool" >/dev/null 2>&1; then
                echo "package-manager command is present: $tool" >&2
                exit 1
              fi
            done
          '; then
            echo "SMOKE FAILED: package-manager command is present"
            exit 1
          fi

          if ! docker run --rm --user 0 --entrypoint sh "$IMG" -ec '
            for path in \
              /usr/local/bin/npm \
              /usr/local/bin/npx \
              /usr/local/bin/pnpm \
              /usr/local/bin/pnpx \
              /usr/local/bin/corepack \
              /usr/local/bin/yarn \
              /usr/local/bin/yarnpkg \
              /usr/local/bin/bun \
              /usr/local/bin/bunx \
              /usr/local/lib/node_modules/npm \
              /usr/local/lib/node_modules/corepack \
              /root/.cache \
              /root/.npm \
              /root/.local/share/pnpm \
              /root/.bun \
              /usr/local/share/.cache; do
              if [ -e "$path" ] || [ -L "$path" ]; then
                echo "package-manager filesystem path is present: $path" >&2
                exit 1
              fi
            done
          '; then
            echo "SMOKE FAILED: package-manager filesystem residue is present"
            exit 1
          fi

          echo "smoke OK (healthz=$ok sibling=$sib spa_manifest=$spa csp=$csp_ok uid=$runtime_uid node_env=$runtime_env package_managers=absent)"

      - name: 🧹 Cleanup smoke containers
        if: always()
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "Smoke cleanup failed: Docker daemon is unavailable" >&2
            exit 1
          fi

          cleanup_failed=0
          if docker container inspect dashboard-smoke >/dev/null 2>&1; then
            if ! docker rm -f dashboard-smoke; then
              cleanup_failed=1
            fi
          else
            echo "Smoke container already absent."
          fi

          if docker network inspect smoke-net >/dev/null 2>&1; then
            if ! docker network rm smoke-net; then
              cleanup_failed=1
            fi
          else
            echo "Smoke network already absent."
          fi

          if [ "$cleanup_failed" -ne 0 ]; then
            echo "Smoke cleanup failed; refusing to continue." >&2
            exit 1
          fi
          echo "Smoke cleanup complete."

      - name: 🔢 Normalize image digest
        id: digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [[ "$DIGEST" != sha256:* ]]; then
            echo "Invalid image digest: $DIGEST" >&2
            exit 1
          fi
          NORMALIZED="${DIGEST#sha256:}"
          if [[ ! "$NORMALIZED" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Invalid image digest: $DIGEST" >&2
            exit 1
          fi
          echo "normalized=$NORMALIZED" >> "$GITHUB_OUTPUT"

      - name: 🔍 Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results-${{ steps.digest.outputs.normalized }}.sarif
          scanners: vuln
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '0'
          version: v0.76.0

      - name: 📦 Upload Trivy SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-sarif-${{ steps.digest.outputs.normalized }}
          path: trivy-results-${{ steps.digest.outputs.normalized }}.sarif
          retention-days: 5

      - name: 🛡️ Upload Trivy results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.42.0
        with:
          sarif_file: trivy-results-${{ steps.digest.outputs.normalized }}.sarif
          category: trivy/release-image

      - name: 📝 Summarize Trivy report
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          ARTIFACT: trivy-sarif-${{ steps.digest.outputs.normalized }}
          CATEGORY: trivy/release-image
        run: |
          {
            echo "### Release image security"
            echo
            echo "- Digest: \`$IMAGE\`"
            echo "- SARIF artifact: \`$ARTIFACT\`"
            echo "- Code scanning category: \`$CATEGORY\`"
            echo "- Report severity: HIGH,CRITICAL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🚦 Enforce fixed HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          version: v0.76.0

      # rm-882: setup-node moved to the build job (tag precompute); the promote
      # job no longer needs a Node runtime of its own.
      # Mint the publication token only after all third-party actions have completed.
      # Fork posture: this repository runs without APPLICATION_ID/APPLICATION_PRIVATE_KEY
      # (no release App is installed), so the token mint is skipped and the App-gated
      # publication steps below degrade to a warning — mirroring the dispatch job's
      # unprovisioned-secret contract. The scanned image is still published to GHCR by
      # the ci-<run> tag from the build step, and :latest promotion needs no App token.
      - name: 🤖 Get App token for publication
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}

      - name: ⚠️ Publication credentials not provisioned
        if: env.HAS_RELEASE_APP != 'true'
        run: >-
          echo "::warning title=CalVer release skipped::APPLICATION_ID/APPLICATION_PRIVATE_KEY
          are not configured in this repository — skipping release-tag creation and
          CalVer/sha image promotion. The scanned image is published as
          ghcr.io/${{ github.repository }}:ci-${{ github.run_id }}-${{ github.run_attempt }}
          and :latest."

      - name: 🏷️ Create release tag
        id: calver
        if: ${{ steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # rm-882 (absorb of upstream #641): create the tag the image was
          # BUILT with (steps.version.outputs.tag), not a fresh computation —
          # the stamp in the footer chip and the git tag are then the same
          # string by construction. A lost race fails loudly here instead of
          # silently minting a different version than the promoted image.
          TAG="${{ steps.version.outputs.tag }}"
          echo "Creating precomputed release tag $TAG"
          gh api --method POST \
            "repos/${{ github.repository }}/git/refs" \
            -f "ref=refs/tags/$TAG" \
            -f "sha=${{ github.sha }}" \
            >/dev/null
          echo "Created tag $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 📦 Promote release-unique image tags
        if: ${{ steps.app-token.outcome == 'success' }}
        run: |
          CALVER="${{ steps.calver.outputs.tag }}"
          SRC="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"

          for TAG in "$CALVER" "sha-${SHORT_SHA}"; do
            for attempt in 1 2 3; do
              if docker buildx imagetools create \
                  --tag "ghcr.io/${{ github.repository }}:$TAG" "$SRC"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "promote failed for $TAG after 3 attempts"
                exit 1
              fi
              echo "promote attempt $attempt failed for $TAG, retrying..."
              sleep 3
            done
          done

          # NOTE (historical quirk, any runner): buildx v0.30.1 printed the default
          # pretty dump for `imagetools inspect --format '{{.Manifest.Digest}}'` on
          # attestation-bearing OCI indexes (template silently ignored, exit 0 —
          # observed 2026-09 on the workstation-era self-hosted runner), so parse the
          # Digest line from the default output instead of trusting the template
          # across buildx versions.
          # rm-691 (2026-10-07): the readbacks below (this one and promote-latest)
          # must NOT let awk exit before consuming docker's full output — under
          # `bash -Eeuo pipefail`, awk's early exit makes docker's next write fail
          # (255 observed live) and the readback conjunct fails despite a parsed
          # digest (four red Release runs: 37567189586, 37574226127, 37453985189,
          # 37435636956). The END-pattern parse is byte-equivalent and preserves
          # docker's real exit status.
          for TAG in "$CALVER" "sha-${SHORT_SHA}"; do
            got=$(docker buildx imagetools inspect \
              "ghcr.io/${{ github.repository }}:$TAG" \
              | awk '/^Digest:/{d=$2} END{print d}')
            if [ "$got" != "${{ steps.build.outputs.digest }}" ]; then
              echo "DIGEST MISMATCH on $TAG: got=$got expected=${{ steps.build.outputs.digest }}"
              exit 1
            fi
          done
          echo "digest verification OK"

      - name: 🚀 Create GitHub Release
        if: ${{ steps.app-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          CALVER="${{ steps.calver.outputs.tag }}"
          DIGEST="${{ steps.build.outputs.digest }}"
          SHA="${{ github.sha }}"

          gh release create "$CALVER" \
            --title "$CALVER" \
            --generate-notes

          EXISTING_BODY="$(gh release view "$CALVER" --json body -q .body)"
          REPO="${{ github.repository }}"
          IMAGE_BLOCK="$(printf '\n\n## Image\n\nImage: ghcr.io/%s:%s\nDigest: ghcr.io/%s@%s\nSource: %s' "$REPO" "$CALVER" "$REPO" "$DIGEST" "$SHA")"

          gh release edit "$CALVER" \
            --notes "${EXISTING_BODY}${IMAGE_BLOCK}"

      - name: 🏷️ Promote latest image tag
        run: |
          SRC="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          verified=0
          for attempt in 1 2 3; do
            got=""
            if docker buildx imagetools create \
                --tag "ghcr.io/${{ github.repository }}:latest" "$SRC" \
                && got="$(docker buildx imagetools inspect \
                  "ghcr.io/${{ github.repository }}:latest" \
                  | awk '/^Digest:/{d=$2} END{print d}')" \
                && [ "$got" = "${{ steps.build.outputs.digest }}" ]; then
              verified=1
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "latest promotion/readback failed after 3 attempts (last digest: ${got:-unavailable})"
              exit 1
            fi
            echo "latest promotion/readback attempt $attempt did not verify, retrying..."
            sleep 3
          done

          if [ "$verified" -ne 1 ]; then
            echo "latest promotion was not verified"
            exit 1
          fi
          echo "latest digest verification OK"

      - name: 🧹 Cleanup on failure (delete Git ref + release)
        if: failure()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG="${{ steps.calver.outputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "No Git ref was created; nothing to clean up."
            exit 0
          fi
          echo "Cleaning up Git ref $TAG and any partial release..."
          gh api --method DELETE \
            "repos/${{ github.repository }}/git/refs/tags/$TAG" \
            >/dev/null 2>&1 || echo "Git ref $TAG not found or already deleted."
          gh release delete "$TAG" --yes 2>/dev/null || echo "Release $TAG not found or already deleted."
          echo "Cleanup complete."

  # Dispatch the gated infra deploy for the version just released. Best-effort: this
  # runs AFTER the release job, so a dispatch failure never affects the published
  # image/tag/release. The infra `deploy-dashboard.yaml` validates the version,
  # independently resolves+verifies the digest, and waits on the operator approval
  # gate (environment: dashboard in infra) before deploying — this dispatch only
  # reaches that gate, it does not bypass it.
  #
  # Auth: a short-lived token minted from a private key created exclusively for this
  # dashboard→infra dispatch (NOT the fro-bot release App above). The token is scoped
  # to marcusrbrown/infra + actions:write. NOTE (see dashboard#112): mint-time scoping
  # narrows the token, not a key-leak blast radius — the secret is environment-scoped
  # to `release` as the primary mitigation; a dedicated infra-only App is the deferred fix.
  dispatch-deploy:
    name: Dispatch infra deploy
    needs: [release]
    if: needs.release.result == 'success' && needs.release.outputs.tag != '' && needs.release.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Best-effort for the WHOLE job: the release is already published, so nothing here
    # may fail the workflow run. continue-on-error covers every step — validation,
    # token mint (which WILL fail until the INFRA_DISPATCH_* secrets are provisioned),
    # and dispatch — so a missing secret or infra-contract gap warns without reddening
    # the release. Failed steps still surface in the run UI as the actionable signal.
    continue-on-error: true
    # Scopes the INFRA_DISPATCH_* secrets to this job only — no other workflow/job
    # in the repo can read the dispatch key.
    environment: release
    permissions:
      contents: read
    steps:
      - name: 🔎 Validate the released version + digest
        env:
          VERSION: ${{ needs.release.outputs.tag }}
          DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]+$'; then
            echo "::warning title=Deploy dispatch skipped::'$VERSION' is not a valid CalVer (YYYY.MM.N); not dispatching. The release is published."
            exit 1
          fi
          # Fail fast on a malformed digest rather than dispatching a bad payload that
          # only infra would catch (defense-in-depth; mirrors the CalVer check).
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "::warning title=Deploy dispatch skipped::'$DIGEST' is not a valid sha256 digest; not dispatching. The release is published."
            exit 1
          fi
          echo "Dispatching deploy for $VERSION ($DIGEST)"

      - name: 🤖 Mint the infra-dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.INFRA_DISPATCH_APP_ID }}
          private-key: ${{ secrets.INFRA_DISPATCH_APP_PRIVATE_KEY }}
          owner: marcusrbrown
          repositories: infra
          permission-actions: write

      - name: 🚀 Dispatch infra deploy-dashboard
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          VERSION: ${{ needs.release.outputs.tag }}
          DIGEST: ${{ needs.release.outputs.digest }}
        run: |
          # Best-effort: the image is already published. A dispatch failure annotates
          # but does not fail — infra can be triggered manually as a fallback.
          if gh workflow run deploy-dashboard.yaml \
              --repo marcusrbrown/infra \
              --ref main \
              -f version="$VERSION" \
              -f digest="$DIGEST"; then
            echo "Dispatched deploy-dashboard for $VERSION (digest $DIGEST) — awaiting operator approval in infra."
          else
            rc=$?
            echo "::warning title=Deploy dispatch failed::Could not dispatch infra deploy-dashboard for $VERSION (exit $rc). The image is published; trigger the infra deploy manually. A 422 means the infra input contract changed (e.g. a renamed input)."
          fi
