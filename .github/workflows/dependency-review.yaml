name: Dependency Review

on:
  pull_request:
    branches: [main, 'conductor/ci-base-**']

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    # rm-188 (cycle 13, 2026-09-25): pinned ubuntu-24.04 — ubuntu-26.04 images are
    # published while the ubuntu-latest alias still maps to 24.04; re-evaluate
    # at the rm-139 Node-26 window (2026-10-28).
    runs-on: ubuntu-24.04
    # rm-603 (2026-10-04): bounded so a wedged review can never hold a runner
    # indefinitely. Sized from the last 30 successful runs (gh api): typical
    # 6-10s, worst observed 275s (4.6m) — 10 gives ~2.2x headroom over the
    # worst and matches the audit/canary/base-drift/upstream-drift 10-minute
    # house ceiling for single-step scheduled checks.
    timeout-minutes: 10
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # rm-421e rationale: 'high' blocks vulnerabilities with direct exploit
          # impact (CVSS high/critical) while not failing the gate on unexploitable
          # low/moderate advisories in the lockfile's transitive surface.
          # 'critical'-only would silently pass high-severity drops; 'moderate'
          # would make the gate noisy against routine transitive churn.
          # Compensating controls for the passed low/moderate band (rm-421e
          # acceptance): pnpm-workspace.yaml `minimumReleaseAge: 1440` (a 24h
          # release-age gate on every install), weekly dependabot cadence with
          # a 1-day cooldown (.github/dependabot.yml), and the committed
          # lockfile installed with --frozen-lockfile (no floating resolution).
          fail-on-severity: high
