name: Dependency Review

on:
  pull_request:
    # conductor/ci-base-** = Conductor's ephemeral validation PRs (see
    # main.yaml); without the glob they never register this check.
    branches: [main, 'conductor/ci-base-**']

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
