name: Dependency Review

on:
  pull_request:
    branches: [main, 'conductor/ci-base-**']

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    # rm-188 (cycle 13, 2026-09-25): pinned ubuntu-24.04 — ubuntu-26.04 images are
    # published while the ubuntu-latest alias still maps to 24.04; re-evaluate
    # at the rm-139 Node-26 window (2026-10-28).
    runs-on: ubuntu-24.04
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # rm-224e rationale: 'high' blocks vulnerabilities with direct exploit
          # impact (CVSS high/critical) while not failing the gate on unexploitable
          # low/moderate advisories in the lockfile's transitive surface.
          # 'critical'-only would silently pass high-severity drops; 'moderate'
          # would make the gate noisy against routine transitive churn.
          fail-on-severity: high
