# rm-179/rm-225 reality canary — weekly read-only proof that EVERY query
# template the aggregator ships is accepted by the real GitHub GraphQL API.
#
# Class guard, not a required check: this workflow exists because a live-syntax
# error (rm-177: //-comments inside the templates) shipped for four days with
# CI green — every aggregator test fakes the transport. A red run here means
# "the real API would reject our query today". Read-only, GITHUB_TOKEN only,
# never writes, never gates merges. The structural offline half of the guard
# lives in test/query-shape-guard.test.ts, which also asserts the canary's
# template set (the registry) is complete (rm-225).
name: GraphQL canary

on:
  schedule:
    - cron: '23 5 * * 1' # Mondays 05:23 UTC — after the 04:13 base-drift check
  workflow_dispatch: {}
  # rm-1961 (cycle 3, 2026-10-17): the shared scheduler silently misses cron
  # fires — this canary is 0/2 lifetime (both deaths at the frozen install) and
  # its Monday cron has never produced a run. A completed Main run re-arms
  # this workflow; the fallback-gate job keeps the weekly cadence.
  workflow_run:
    workflows: [Main]
    types: [completed]

permissions:
  # Mint-family match (AGENTS.md invariant 1): the aggregator's installation
  # tokens carry pull_requests/checks/issues/contents/metadata read, and the
  # query reads statusCheckRollup (checks family) and checkWorkflowRuns
  # (actions family) — so the canary must hold the same read-only scope
  # profile, not a narrower one, to verify the production contract. Workflow
  # scope names are hyphenated and `metadata` is not a GITHUB_TOKEN scope
  # (it is an installation-token mint-family permission), so the closest
  # schema-valid set is used; all read-only.
  contents: read
  checks: read
  actions: read
  pull-requests: read
  issues: read

jobs:
  fallback-gate:
    # rm-1961: gate for the workflow_run fallback trigger above. Fallback
    # fires that are off-main (PR-triggered Main runs) or already covered by
    # a success inside the recency window are skipped; scheduled and manual
    # fires always pass (skip=false).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.recency.outputs.skip }}
    steps:
      - name: Fallback-fire recency dedupe
        id: recency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != 'workflow_run' ]; then
            echo 'skip=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.workflow_run.head_branch }}" != 'main' ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since="$(date -u -d '6 days ago' +%Y-%m-%d)"
          recent="$(gh run list -R "$GITHUB_REPOSITORY" --workflow canary.yaml \
            --status success --created "$since" --json databaseId --jq 'length')"
          echo "recent-successes=$recent since=$since"
          if [ "$recent" -gt 0 ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

  canary:
    needs: fallback-gate
    if: needs.fallback-gate.outputs.skip != 'true'
    # rm-188 (cycle 13, 2026-09-25): pinned ubuntu-24.04 — ubuntu-26.04 images are
    # published while the ubuntu-latest alias still maps to 24.04; re-evaluate
    # at the rm-139 Node-26 window (2026-10-28).
    runs-on: ubuntu-24.04
    # rm-280 (2026-10-01): 5 → 10 — the rm-280 install (below) adds the cold
    # pnpm-install spread on top of the seconds-scale canary run itself. Cold
    # installs measured 5-84s at aa9937f (run 35688534671 — the setup action's
    # own rm-145 note) and the pnpm-store cache only helps from the second run
    # on, so 10 covers a slow cold runner without inviting a silent hang.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rm-280 (2026-10-01): the canary was born NOT zero-install. At that
      # point the script imported the production chain (scripts/graphql-canary.ts
      # → src/github/aggregator.ts → src/result.ts → bare npm specifier
      # @bfra.me/es/result), so without node_modules it died ~10s in with
      # ERR_MODULE_NOT_FOUND: the workflow's only run ever (36417620616, a
      # 2026-09-28 dispatch) did exactly that, and the weekly cron had never
      # produced a run. rm-280's acceptance offered install-vs-inline and chose
      # INSTALL, via the same digest-pinned composite every Main job runs
      # (pnpm + Node 24 + cache: pnpm + `pnpm install --frozen-lockfile`).
      # rm-288 (2026-10-03, run 7ce48fe5 integrate) landed the sibling half:
      # the registry moved to zero-import src/github/query-registry.ts and
      # scripts/graphql-canary.ts now imports only it, so the script itself no
      # longer needs node_modules. The install step STAYS — both halves of the
      # rm-280/rm-288 family on one tree (see the rm-280/rm-288 riders): parity
      # with every Main job's composite, a scheduled frozen-lockfile check, and
      # no path back to the 36417620616 failure if the script or the registry
      # module ever regains a package import (the rot class the zero-install
      # solution doc in docs/solutions/workflow-issues/ warns about).
      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: Execute every registered query template (rm-225)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/graphql-canary.ts
