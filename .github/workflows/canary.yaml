# rm-179/rm-225 reality canary — weekly read-only proof that EVERY query
# template the aggregator ships is accepted by the real GitHub GraphQL API.
#
# Class guard, not a required check: this workflow exists because a live-syntax
# error (rm-177: //-comments inside the templates) shipped for four days with
# CI green — every aggregator test fakes the transport. A red run here means
# "the real API would reject our query today". Read-only, GITHUB_TOKEN only,
# never writes, never gates merges. The structural offline half of the guard
# lives in test/query-shape-guard.test.ts, which also asserts the canary's
# template set (the registry) is complete (rm-225).
name: GraphQL canary

on:
  schedule:
    - cron: '23 5 * * 1' # Mondays 05:23 UTC — after the 04:13 base-drift check
  workflow_dispatch: {}

permissions:
  # rm-228 (cycle-18, run 743f2e47) — truthful scope parity. The query
  # reads: statusCheckRollup/checkSuites/checkRuns (checks family),
  # pullRequests (pull-requests), issues, vulnerabilityAlerts (security-events
  # family, the optional selection), and the repo/branch itself (contents).
  # The previous comment claimed a `checkWorkflowRuns` (actions) read that no
  # shipped template performs, so actions:read padded the set for a read that
  # never happens — dropped. `security-events: read` is added to mirror the
  # optional mint family; if the hosted token still cannot read Dependabot
  # alerts (not provable from inside the workflow), the script degrades the
  # alerts-carrying template to a SCOPE-LIMITED notice exactly like
  # production's rm-170 fallback instead of red. `metadata` is not a
  # GITHUB_TOKEN scope (installation-token mint family). All read-only,
  # matching the aggregator's read-only-by-construction invariant.
  contents: read
  checks: read
  pull-requests: read
  issues: read
  security-events: read

jobs:
  canary:
    # rm-188 (cycle 13, 2026-09-25): pinned ubuntu-24.04 — ubuntu-26.04 images are
    # published while the ubuntu-latest alias still maps to 24.04; re-evaluate
    # at the rm-139 Node-26 window (2026-10-28).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24 (native TS, no install needed)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Execute every registered query template (rm-225)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/graphql-canary.ts
