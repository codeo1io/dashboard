# rm-179/rm-225 reality canary — weekly read-only proof that EVERY query
# template the aggregator ships is accepted by the real GitHub GraphQL API.
#
# Class guard, not a required check: this workflow exists because a live-syntax
# error (rm-177: //-comments inside the templates) shipped for four days with
# CI green — every aggregator test fakes the transport. A red run here means
# "the real API would reject our query today". Read-only, GITHUB_TOKEN only,
# never writes, never gates merges. The structural offline half of the guard
# lives in test/query-shape-guard.test.ts, which also asserts the canary's
# template set (the registry) is complete (rm-225).
name: GraphQL canary

on:
  schedule:
    - cron: '23 5 * * 1' # Mondays 05:23 UTC — after the 04:13 base-drift check
  workflow_dispatch: {}

permissions:
  # Mint-family match (AGENTS.md invariant 1): the aggregator's installation
  # tokens carry pull_requests/checks/issues/contents/metadata read, and the
  # query reads statusCheckRollup (checks family) and checkWorkflowRuns
  # (actions family) — so the canary must hold the same read-only scope
  # profile, not a narrower one, to verify the production contract. Workflow
  # scope names are hyphenated and `metadata` is not a GITHUB_TOKEN scope
  # (it is an installation-token mint-family permission), so the closest
  # schema-valid set is used; all read-only.
  contents: read
  checks: read
  actions: read
  pull-requests: read
  issues: read

jobs:
  canary:
    # rm-188 (cycle 13, 2026-09-25): pinned ubuntu-24.04 — ubuntu-26.04 images are
    # published while the ubuntu-latest alias still maps to 24.04; re-evaluate
    # at the rm-139 Node-26 window (2026-10-28).
    runs-on: ubuntu-24.04
    # rm-395 (2026-10-02, run ddc4c014228a): the 2026-09-28 install-less
    # shape produced the canary's only-ever run and it died before the first
    # query executed — run 36417620616 log: ERR_MODULE_NOT_FOUND
    # '@bfra.me/es' imported from src/result.ts (chain:
    # scripts/graphql-canary.ts:23 -> src/github/aggregator.ts:31-33 value
    # imports -> src/result.ts:12), with the bare 'yaml' import in
    # src/github/metadata.ts:28 the same failure class behind it. The canary
    # executes src/ modules, so it needs the workspace's frozen install like
    # every other job — the repo's composite setup action provides it
    # (checkout stays required for the local action). Timeout 10 min: the
    # install adds minutes to what was a 5-min budget.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup (Node 24 + pnpm + frozen install)
        uses: ./.github/actions/setup

      - name: Execute every registered query template (rm-225)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/graphql-canary.ts
