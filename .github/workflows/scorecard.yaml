---
name: Scorecard supply-chain security

on:
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1'

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    # rm-188 (cycle 13, 2026-09-25): pinned ubuntu-24.04 — ubuntu-26.04 images are
    # published while the ubuntu-latest alias still maps to 24.04; re-evaluate
    # at the rm-139 Node-26 window (2026-10-28).
    runs-on: ubuntu-24.04
    # rm-603 (2026-10-04): bounded so a wedged analysis can never hold a runner
    # indefinitely. Sized from the last 30 successful runs (gh api): typical
    # 30-38s, worst observed 474s (7.9m) — 15 gives ~1.9x headroom over the
    # worst and matches visual.yaml's 15-minute ceiling, the nearest house
    # precedent for a scheduled single-job analysis workflow.
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ github.token }}
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Scorecard SARIF
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
