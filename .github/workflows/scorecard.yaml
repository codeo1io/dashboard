---
name: Scorecard supply-chain security

on:
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1'

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # rm-2144 (2026-10-21): every workflow job must declare an execution
    # budget — this was the repo's only unbounded job of 13 (pinned by
    # test/workflow-hardening-guard.test.ts). 20 matches the slowest analysis
    # neighbors (CodeQL/fro-bot) — generous by design: a hang must die by
    # timeout, not eat the runner until a human notices.
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ github.token }}
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Scorecard SARIF
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: results.sarif
