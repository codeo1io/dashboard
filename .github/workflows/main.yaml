# Continuous Integration jobs for changes headed to main.
---
name: Main

on:
  pull_request:
    branches: [main, 'conductor/ci-base-**']
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

jobs:
  lint:
    name: Lint
    permissions:
      contents: read
    # rm-188 (cycle 13, 2026-09-25): pinned ubuntu-24.04 — ubuntu-26.04 images are
    # published while the ubuntu-latest alias still maps to 24.04; re-evaluate
    # at the rm-139 Node-26 window (2026-10-28).
    runs-on: ubuntu-24.04
    # rm-13640 rider (2026-09-29; wording made truthful by rm-486 — the
    # cycle-2 comment-truth item, minted rm-281 and renumbered at the
    # 2026-10-03 integrate; main's rm-281 is the CodeQL suppression
    # recipe — 2026-09-30): the Lint job self-kills at 35 min — above the worst
    # legitimate cold repo-wide eslint on the shared runner pool (the
    # 2026-09-29 markdown paragraph-length cliff ran a single file past
    # 35 min before the paragraph-split fix) and below the CI validator's
    # ~36-minute poll window, so a wedged lint can never wedge validation.
    # Every other job in this file — including Test, the heavyweight
    # precedent for ordinary jobs — self-kills at 20. The 35 ceiling is
    # load-bearing: raise it and validation's poll window closes first;
    # lower it and a legitimate cold lint dies.
    timeout-minutes: 35
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - env:
          TIMING: 1
        name: 💅🏽 Lint
        run: bun run lint

  design-check:
    name: Design Check
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: 🎨 Detect UI anti-patterns
        run: |
          # Pinned: an older major ignores .impeccable/config.json ignoreValues and would fail the gate on intentional brand tokens.
          # Exit 2 means findings; 1 means a target could not be scanned. Some versions exit 0 on a missing path, hence the path check.
          # stdout is a JSON array. Primary entries have no `advisory: true`; advisories are printed and never block.
          for target in web/src web/privacy.html; do
            if [ ! -e "$target" ]; then
              echo "::error::Design Check target '$target' does not exist. Update the scanned paths in this step."
              exit 1
            fi
          done

          work=$(mktemp -d)
          rc=0
          findings=$(npx impeccable@4.6.0 detect --json web/src web/privacy.html 2>"$work/stderr") || rc=$?

          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "::error::Impeccable could not scan (exit $rc)."
            cat "$work/stderr"
            exit 1
          fi

          # Split the array into primary and advisory entries; print "<primary> <advisory>" counts.
          if ! counts=$(printf '%s' "$findings" | node -e '
            const fs = require("node:fs");
            let data;
            try {
              data = JSON.parse(fs.readFileSync(0, "utf8"));
            } catch {
              process.exit(3);
            }
            if (!Array.isArray(data)) process.exit(3);
            const primary = data.filter((entry) => entry?.advisory !== true);
            const advisory = data.filter((entry) => entry?.advisory === true);
            const dir = process.argv[1];
            fs.writeFileSync(dir + "/primary.json", JSON.stringify(primary, null, 2));
            fs.writeFileSync(dir + "/advisory.json", JSON.stringify(advisory, null, 2));
            process.stdout.write(primary.length + " " + advisory.length);
          ' "$work"); then
            echo "::error::Impeccable could not scan: stdout is not a JSON array (exit $rc)."
            echo "$findings"
            cat "$work/stderr"
            exit 1
          fi
          primary_count=${counts% *}
          advisory_count=${counts#* }

          if [ "$primary_count" -gt 0 ]; then
            cat "$work/primary.json"
            echo
            echo "Impeccable detected UI anti-patterns. Address them or, for an intentional brand choice, add a scoped ignore via 'impeccable ignores add-value'."
            exit 1
          fi
          if [ "$rc" -eq 2 ]; then
            echo "::error::Impeccable exited 2 but reported no primary findings; treating the output as inconsistent."
            echo "$findings"
            exit 1
          fi
          if [ "$advisory_count" -gt 0 ]; then
            echo "::notice::Impeccable reported $advisory_count advisory finding(s); advisories do not block."
            cat "$work/advisory.json"
            echo
            echo "No blocking UI anti-patterns detected."
            exit 0
          fi
          echo "No UI anti-patterns detected."

  check-types:
    name: Check Types
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: ✅ Validate Types
        run: bun run check-types

  test:
    name: Test
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: 🏗 Build web
        run: bun run build:web

      - name: 💾 Restore Impeccable engine cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.impeccable/bin
          key: impeccable-engine-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.agents/skills/impeccable/scripts/VERSION') }}

      - name: 🧪 Run Tests
        run: bun run test

  check-workflows:
    name: Check Workflows
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # raven-actions/actionlint defaults to pyflakes via pipx, which is not
      # guaranteed present on any runner image (it was missing entirely on the
      # workstation-era self-hosted runner: Main run 35413084207, 'Unable to locate
      # executable file: pipx'). The container form assumes nothing from the
      # host and pins actionlint itself (see docs/solutions/
      # workflow-issues/actionlint-pipx-missing-container-form-2026-09-19.md).
      - name: 🛠 Lint Workflows
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12 -no-color

  test-scripts-load:
    name: Test Scripts Load
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: 🧪 Load production scripts under Node strip-only
        # Node 24's strip-only TypeScript execution only erases type annotations -- it does
        # not transform TS-specific class constructs (parameter properties, enum, namespace).
        # Neither `tsc --noEmit` nor Vitest exercise the strip-only parser, so those runtime
        # errors used to surface only at runtime. Importing each production module here catches
        # them at merge time instead. Recursive over src/ so nested modules (routes/, github/,
        # auth/) are covered as the app grows, excluding tests.
        run: |
          while IFS= read -r f; do
            node -e "import('./$f').then(() => {}).catch(err => { process.stderr.write('FAIL $f: ' + (err.code || err.message) + '\\n'); process.exit(1); })"
            echo "  ok   $f"
          done < <(find src -name '*.ts' ! -name '*.test.ts' | sort)
