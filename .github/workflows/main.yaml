# Continuous Integration jobs for changes headed to main.
---
name: Main

on:
  pull_request:
    branches: [main, 'conductor/ci-base-**']
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

jobs:
  lint-plan:
    name: Lint Plan
    permissions:
      contents: read
    # rm-188 (cycle 13, 2026-09-25): pinned ubuntu-24.04 — ubuntu-26.04 images are
    # published while the ubuntu-latest alias still maps to 24.04; re-evaluate
    # at the rm-139 Node-26 window (2026-10-28).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      # rm-294 (run f91bcdc2c6f7 cycle-2, 2026-09-30): derives the Lint matrix
      # from scripts/lint-shards.ts (single source of truth) after asserting
      # EXACT coverage — the union of the shard globs must equal the repo lint
      # set (tracked files eslint does not ignore), no file linted zero times
      # or twice. A red plan job means the shard map drifted from the tree;
      # fix the map in scripts/lint-shards.ts, not here.
      - name: 🧮 Assert shard coverage + emit lint matrix
        id: plan
        run: echo "matrix=$(node scripts/lint-shards.ts plan)" >> "$GITHUB_OUTPUT"
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}

  lint:
    name: Lint (${{ matrix.shard }})
    needs: lint-plan
    permissions:
      contents: read
    # rm-188 (cycle 13, 2026-09-25): pinned ubuntu-24.04 — ubuntu-26.04 images are
    # published while the ubuntu-latest alias still maps to 24.04; re-evaluate
    # at the rm-139 Node-26 window (2026-10-28).
    runs-on: ubuntu-24.04
    # rm-294 (run f91bcdc2c6f7 cycle-2, 2026-09-30), superseding rm-13640's
    # fixed 35-min whole-job rider (2026-09-29): the monolithic cold repo-wide
    # Lint was flaky-under-ceiling on the hosted pool — 12m17s and 17m24s on
    # green runs vs >35m rider-killed on the same day's validation runs — so
    # Lint is now a matrix of cost-class shards with per-shard riders
    # (timeout-minutes arrives from the plan job). The shard map, riders, and
    # the exact-coverage assertion live in scripts/lint-shards.ts; re-measure
    # cold durations there before re-sizing. markdown-roadmap carries the
    # rm-103 paragraph cliff (ROADMAP.md ~10KB signals lines) and keeps the
    # largest rider until that cure lands. rm-116 note: required-check names
    # are now 'Lint (<shard>)', not 'Lint'.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.lint-plan.outputs.matrix) }}
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      # TIMING=1 was dropped with the eslint CLI: it is inert under the
      # API-based shard runner, which prints per-shard duration itself.
      - name: 💅🏽 Lint (shard ${{ matrix.shard }})
        run: node scripts/lint-shards.ts run ${{ matrix.shard }}

  audit:
    name: Dependency audit (advisory)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      # rm-293 (run f91bcdc2c6f7 cycle-2, 2026-09-30): advisory-mode dependency
      # audit — the 2026-09-30 census (19 advisories: 3 low / 8 moderate /
      # 8 high, incl. fast-uri GHSA-qw65-cvwx-89v3 + GHSA-58mr-gqgx-xq4g as
      # Dependabot alerts #29/#30) is now visible in every Main run log
      # instead of invisible. Deliberately non-failing this cycle; enforcement
      # belongs to the ledger's gated floors work (rm-278/rm-281 lineage,
      # acceptance `pnpm audit -r` == 0). Do not drop continue-on-error or
      # raise --audit-level until that lands.
      - name: 🔎 Dependency audit (advisory mode — logged, never red this cycle)
        continue-on-error: true
        run: pnpm audit --recursive

  design-check:
    name: Design Check
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: 🎨 Detect UI anti-patterns
        run: |
          # Pinned: an older major ignores .impeccable/config.json ignoreValues and would fail the gate on intentional brand tokens.
          findings=$(npx --yes impeccable@3.2.1 detect --json web/src web/privacy.html)
          if [ "$findings" != "[]" ]; then
            echo "$findings"
            echo "Impeccable detected UI anti-patterns. Address them or, for an intentional brand choice, add a scoped ignore via 'impeccable ignores add-value'."
            exit 1
          fi
          echo "No UI anti-patterns detected."

  check-types:
    name: Check Types
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: ✅ Validate Types
        run: pnpm check-types

  test:
    name: Test
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      # No explicit "Build web" step: the pretest hook (package.json) builds the
      # client before vitest runs, so a separate step would build it twice.
      - name: 🧪 Run Tests
        run: pnpm test

  check-workflows:
    name: Check Workflows
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # raven-actions/actionlint defaults to pyflakes via pipx, which is not
      # guaranteed present on any runner image (it was missing entirely on the
      # workstation-era self-hosted runner: Main run 35413084207, 'Unable to locate
      # executable file: pipx'). The container form assumes nothing from the
      # host and pins actionlint itself (see docs/solutions/
      # workflow-issues/actionlint-pipx-missing-container-form-2026-09-19.md).
      - name: 🛠 Lint Workflows
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12 -no-color

  test-scripts-load:
    name: Test Scripts Load
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: 📦 Setup
        uses: ./.github/actions/setup

      - name: 🧪 Load production scripts under Node strip-only
        # Node 24's strip-only TypeScript execution only erases type annotations -- it does
        # not transform TS-specific class constructs (parameter properties, enum, namespace).
        # Neither `tsc --noEmit` nor Vitest exercise the strip-only parser, so those runtime
        # errors used to surface only at runtime. Importing each production module here catches
        # them at merge time instead. Recursive over src/ so nested modules (routes/, github/,
        # auth/) are covered as the app grows, excluding tests.
        run: |
          while IFS= read -r f; do
            node -e "import('./$f').then(() => {}).catch(err => { process.stderr.write('FAIL $f: ' + (err.code || err.message) + '\\n'); process.exit(1); })"
            echo "  ok   $f"
          done < <(find src -name '*.ts' ! -name '*.test.ts' | sort)
