# Standing dependency-audit gate (rm-356). dependency-review.yaml only
# inspects PR diffs, so a standing floor/GHSA regression on main (e.g. the
# 2026-10-01 undici 7.x GHSA wave) is otherwise invisible until it reaches a
# PR. Shape carried from the closed-unmerged PR #325 lineage.
name: Audit
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
jobs:
  audit:
    runs-on: [ubuntu-latest]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.27.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --recursive
