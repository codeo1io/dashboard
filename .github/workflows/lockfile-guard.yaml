# Wall-family armor (2026-10-05): the 3-second lockfile-consistency gate —
# the missing pre-install check that would have caught the 2026-10-04 1e1e2f5
# break at merge time (an upstream merge rode upstream's pnpm-lock.yaml in
# against the fork's pnpm-workspace.yaml floors; every install-bearing
# workflow then died ~1 min into Setup with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH
# and 8 of 12 check-runs sat red on main for ~12 h — 4 of 5 push workflows
# by class). Ledger anchors on main: the wall family rides rm-285 (floors /
# lockfile reconcile) and the required-check interlock rides rm-116. Delivery
# lineages, content-identical: run 5e661558 cycle:1 B4 (byte-adopted; landed
# at 032fb6f, GREEN on ephemeral PR #385 run 37346287839) and run cfa9f94b
# cycle 3 unfreeze batch B4 (landed at 60cb484, GREEN on ephemeral PRs #389 /
# #392, 11/11 checks), which itself content-adopted from sibling run
# 3570419605cb's uncommitted B4 ← run a2def4ce34dc — those stranded
# lineages' pre-landing 'rm-648' mint lost to landed meanings per the
# d00d095 convention (landed rm-648 is run 73d35a6ca2bd's weekly trivy
# digest scan), so this header cites the landed anchors instead.
#
# `pnpm install --frozen-lockfile --lockfile-only` resolves and validates the
# lockfile WITHOUT installing node_modules: ~1 s on the cured tree (933 ms
# measured 2026-10-05) and red with the exact CONFIG_MISMATCH on divergence
# (reproduced on the pre-cure blob the same day). It must run BEFORE any real
# install — a vitest-based guard is chicken-and-egg (the tests need the very
# install this gate protects), and the setup composite cannot host it (its
# whole job is to run the install). pnpm comes from package.json's
# packageManager field via pnpm/action-setup — the same single pin source the
# composite uses; no Node pin is needed because no project code executes.
# The job is also the required-check context the rm-116 ruleset keys on:
# keep the 'Lockfile Guard' name stable if this file is ever edited.
name: Lockfile Guard

on:
  pull_request:
    branches: [main, 'conductor/ci-base-**']
    types: [opened, ready_for_review, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lockfile-guard:
    name: Lockfile Guard
    # rm-188-era pin (2026-09-25): ubuntu-24.04, not ubuntu-latest — ubuntu-26.04
    # images are published while the alias still maps to 24.04; re-evaluate at
    # the rm-139 Node-26 window (2026-10-28).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: ⤵ Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm (version from packageManager)
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      # The gate itself. Runs before any install by construction — nothing
      # above installs. See the file header for why it cannot live in the
      # setup composite or behind vitest.
      - name: 🔒 Lockfile consistency
        run: pnpm install --frozen-lockfile --lockfile-only
        shell: bash -Eeuo pipefail {0}
