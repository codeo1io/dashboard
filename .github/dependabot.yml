# Dependency automation for codeo1io/dashboard.
#
# Why this exists: Renovate never runs on this fork — PR #1 deleted
# .github/workflows/renovate.yaml under the self-hosted-runners-only CI
# policy, no Renovate app installation exists, and the orphaned
# .github/renovate.json5 was deleted 2026-09-22 (rm-136). This dependabot
# config IS the fork's dependency automation: weekly grouped PRs, with the
# first expected from the 2026-09-19 enable window (~2026-10-03).
#
# Conventions honored:
# - GitHub Actions updates preserve the repo's commit-SHA pinning style.
# - Grouped updates: one grouped PR per ecosystem per week instead of a PR
#   per dependency, keeping review load proportional to the weekly cadence.
#   (The original 2026-09 rationale — every PR's checks serializing behind
#   the fork's single self-hosted runner — became historical when PR #11/#12
#   moved CI to GitHub-hosted runners on 2026-09-22.)
# - cooldown.default-days: 1 holds every PR one day after upstream publication
#   (rm-135's dependabot half; mirrors pnpm-workspace.yaml's minimumReleaseAge:
#   1440 at :13, which carries the matching minimumReleaseAgeExclude list).
#   Units differ: dependabot cooldown is DAYS, pnpm minimumReleaseAge is MINUTES.
#   GitHub does not apply cooldown to security updates — they land without delay.
# - Weekly cadence, low open-PR cap, to keep the runner queue shallow.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    open-pull-requests-limit: 3
    groups:
      npm-and-workspaces:
        patterns:
          - '*'
    ignore:
      # Major updates are deferred until a migration is planned (2026-09-21,
      # cycle-5 batch B6 / rm-133). Vitest 5 removes reporters/flags the suite
      # relies on; TypeScript 7 must be re-verified against the strip-only
      # erasableSyntaxOnly pipeline. Minor/patch updates stay open.
      # Re-evaluate: 2026-10-21.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns:
          - '*'
