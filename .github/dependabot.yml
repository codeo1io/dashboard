# Dependency automation for codeo1io/dashboard.
#
# Why this exists: Renovate never runs on this fork — PR #1 deleted
# .github/workflows/renovate.yaml under the self-hosted-runners-only CI
# policy and no Renovate app installation exists. .github/renovate.json5
# persists (retargeted to codeo1io/renovate-config in a3bf45a) but nothing
# invokes it. This dependabot config IS the fork's dependency automation:
# weekly grouped PRs, with the first expected from the 2026-09-19 enable
# window (~2026-10-03).
#
# Conventions honored:
# - GitHub Actions updates preserve the repo's commit-SHA pinning style.
# - Grouped updates: the fork has ONE self-hosted runner, so every PR's checks
#   serialize behind everything else — one grouped PR per ecosystem per week
#   instead of a PR per dependency.
# - Weekly cadence, low open-PR cap, to keep the runner queue shallow.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-and-workspaces:
        patterns:
          - '*'

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns:
          - '*'
