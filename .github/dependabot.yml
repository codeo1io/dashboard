# Dependency automation for codeo1io/dashboard.
#
# Why this exists: Renovate has never run on this fork (shared fro-bot config in
# .github/renovate.json5, but no Renovate app installation — 1 PR total in repo
# history, manual). Upstream fro-bot/dashboard receives automated dependency PRs
# continuously; this fork moves only by manual upstream merges without this file.
#
# Conventions honored:
# - GitHub Actions updates preserve the repo's commit-SHA pinning style.
# - Grouped updates: the fork has ONE self-hosted runner, so every PR's checks
#   serialize behind everything else — one grouped PR per ecosystem per week
#   instead of a PR per dependency.
# - Weekly cadence, low open-PR cap, to keep the runner queue shallow.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-and-workspaces:
        patterns:
          - '*'
    ignore:
      # Major updates are deferred until a migration is planned (2026-09-21,
      # cycle-5 batch B6 / rm-133). Vitest 5 removes reporters/flags the suite
      # relies on; TypeScript 7 must be re-verified against the strip-only
      # erasableSyntaxOnly pipeline. Minor/patch updates stay open.
      # Re-evaluate: 2026-10-21.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns:
          - '*'
