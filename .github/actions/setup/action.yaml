---
name: Setup
description: Setup build environment and install dependencies

# 2026-09-23 (rm-142): the 2026-09-19 note below described the self-hosted
# runner era, which ended with d73fbe7/aa9937f moving all fork CI to ephemeral
# GitHub-hosted ubuntu-latest runners. On ephemeral runners every job pays a
# cold pnpm install from the registry (measured 2026-09-23: 5m0s for the test
# job's install step of an 11m15s Main run). setup-node's `cache: pnpm` now
# restores/saves the pnpm store via the GitHub cache service instead. The
# vestigial cache-version input survived that 2026-09-19 removal (zero callers
# by then); rm-142 removes it now. setup-node derives its cache key from the
# lockfile.
runs:
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash -Eeuo pipefail {0}
  using: composite
