---
name: Setup
description: Setup build environment and install dependencies

inputs:
  cache-version:
    default: '0'
    description: Cache version. Can be incremented to invalidate the cache.
    required: false

# 2026-09-19: the pnpm-store actions/cache round-trip was removed. At the time
# this action ran on a self-hosted runner whose pnpm store persisted on local
# disk across jobs, so the GitHub cache-service upload/download was pure overhead
# (each of the six jobs in Main paid it; measured 1-3 min per job of cache
# restore+save against a store that was already warm on disk). CI moved to
# GitHub-hosted ubuntu-latest in d73fbe7/aa9937f; the removal stayed because
# warm local-disk stores no longer exist there either — pnpm's own store
# hardlinking keeps install cost low enough that cache round-trips still do not
# pay for themselves.
runs:
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash -Eeuo pipefail {0}
  using: composite
