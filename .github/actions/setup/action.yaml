---
name: Setup
description: Setup build environment and install dependencies

inputs:
  cache-version:
    default: '0'
    description: Cache version. Can be incremented to invalidate the cache.
    required: false

# 2026-09-19: the pnpm-store actions/cache round-trip was removed. This action
# runs on a self-hosted runner whose pnpm store persists on local disk across
# jobs, so the GitHub cache-service upload/download was pure overhead (each of
# the six jobs in Main paid it; measured 1-3 min per job of cache restore+save
# against a store that was already warm on disk).
runs:
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash -Eeuo pipefail {0}
  using: composite
