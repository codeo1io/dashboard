---
name: Setup
description: Setup build environment and install dependencies

inputs:
  cache-version:
    default: '0'
    description: Cache version. Can be incremented to invalidate the cache.
    required: false

# 2026-09-22 (rm-145): CI runs on GitHub-hosted ubuntu-latest runners (moved
# off the single self-hosted runner by PR #11/#12), so nothing persists on
# disk between jobs and every job cold-installed the full dependency tree
# (Main jobs measured 5-84s at aa9937f, run 35688534671). The managed
# install cache below restores the warm-store economics the self-hosted era
# got for free. Since upstream #648 (2026.10.48 adoption) the manager is Bun:
# the actions/cache step keys on the bun.lock hash (+ year-month bucket), so
# there is no manual cache-version input to maintain — bump the lockfile and
# the cache keys rotate themselves.
runs:
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'

    - id: configure-cache
      name: Configure cache
      run: |
        bun_cache_path="$HOME/.bun/install/cache"
        mkdir -p "$bun_cache_path" || exit 1
        echo "path=$bun_cache_path" >> $GITHUB_OUTPUT
        year_month=$(date -u '+%Y-%m')
        base_key="bun-install-v${{ inputs.cache-version }}-${{ runner.os }}-${year_month}-"
        echo "key=${base_key}${{ hashFiles('bun.lock') }}" >> $GITHUB_OUTPUT
        echo "restore-keys=${base_key}" >> $GITHUB_OUTPUT
      shell: bash -Eeuo pipefail {0}

    - name: Restore Bun install cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        key: ${{ steps.configure-cache.outputs.key }}
        path: ${{ steps.configure-cache.outputs.path }}
        restore-keys: ${{ steps.configure-cache.outputs.restore-keys }}

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash -Eeuo pipefail {0}
  using: composite
