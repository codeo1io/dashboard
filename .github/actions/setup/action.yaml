---
name: Setup
description: Setup build environment and install dependencies

# 2026-09-22 (rm-145): CI runs on GitHub-hosted ubuntu-latest runners (moved
# off the single self-hosted runner by PR #11/#12), so nothing persists on
# disk between jobs and every job cold-installed the full dependency tree
# (Main jobs measured 5-84s at aa9937f, run 35688534671). The setup-node
# managed pnpm-store cache below restores the warm-store economics the
# self-hosted era got for free. It keys on the pnpm-lockfile hash + node
# version, so there is no manual cache-version input to maintain — bump the
# lockfile (or the node pin) and the cache keys rotate themselves.
runs:
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68e0bde69e1b6c0e6c1d3fdc4392c66e5e1 # v6

    - name: Setup Node.js
      uses: actions/setup-node@2028f363a52288f53a487b2451c1322c31a57e45 # v7.1.0
      with:
        node-version: '24'
        cache: pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash -Eeuo pipefail {0}
  using: composite
