allowBuilds:
  '@swc/core': true
  # @opencode-ai/plugin is a type-only devDependency (OpenCode runs its own plugin
  # host); its transitive native accelerator never needs to build here.
  msgpackr-extract: false
  unrs-resolver: true

# Supply-chain gate (rm-133): block packages published less than 1440 minutes
# (1 day) ago — stops same-day compromise pushes while keeping weekly
# dependabot PRs mergeable. Set deliberately (the gate is inert without this
# key); the @bfra.me excludes below stay because those config packages are
# first-party pins that sometimes need same-day adoption.
minimumReleaseAge: 1440

# rm-196 rider (2026-09-25): hono@4.13.9 and vite@8.3.1 are the rider targets,
# both past their 1440-minute maturity timestamps — an explicit, disclosed
# bypass of the rm-133 age gate, not a weakening of it.
minimumReleaseAgeExclude:
  - '@bfra.me/eslint-config@0.51.2 || 0.51.3 || 0.51.4 || 0.52.0 || 0.52.1 || 0.52.2'
  - '@bfra.me/tsconfig@0.13.2'
  - hono@4.13.9
  - vite@8.3.1

overrides:
  # rm-286 (2026-09-30): floors raised to the current patched lines — a
  # floor never forces re-resolution off an already-satisfying version, so
  # the lockfile sat inside advisory ranges (19 advisories, 8 high, all
  # dev/build-transitive) while Dependabot surfaced only 2 (run
  # 0a6430c9ba13 assess+research; upstream had the identical resolutions).
  # GHSA-q2hr-2g5m-vwhr (>=2.1.7), GHSA-qhr7-859c-m2p7 (>=2.1.6) and
  # GHSA-6j4f-fj2g-mc7p (>=2.1.5) — brace-expansion@2 is dev-transitive
  # via vite-plugin-pwa>workbox-build; 2.1.7 covers all three.
  brace-expansion@2: '>=2.1.7 <3.0.0'
  # The same three advisories on the 5.x line — brace-expansion@5 is
  # dev-transitive via @bfra.me/eslint-config; 5.0.12 covers all three
  # per-major patched lines (5.0.10/5.0.11/5.0.12).
  brace-expansion@5: '>=5.0.12 <6.0.0'
  # GHSA-qw65-cvwx-89v3 + GHSA-58mr-gqgx-xq4g patched at 3.1.7, but
  # GHSA-hrr3-gc8f-f4qj needs 3.1.8 (matches upstream fro-bot/dashboard
  # PR #538) — fast-uri is dev-transitive via
  # @bfra.me/eslint-config>eslint-plugin-json-schema-validator>ajv.
  fast-uri@3: '>=3.1.8 <4.0.0'
  # GHSA-82x6-q7mm-w9cf — toml is dev-transitive via
  # @opencode-ai/plugin>effect; >=4.2.0 is the patched line
  # (rescued by content from run b4aac9ba / PR #82 via cycle-13;
  # the batch's internal rm-171 numbering collided with landed ids).
  toml: '>=4.2.0'
  # Ten undici advisories (2 high: GHSA-w293-vg96-wgc3,
  # GHSA-rfgv-xxqx-mfg5; GHSA-3wwx-pv8p-q78v was Dependabot alert #31,
  # auto-dismissed as dev-scope one second after creation) — undici is
  # dev-scope via direct devDep jsdom; >=7.29.1 is the patched line for
  # all ten.
  undici@7: '>=7.29.1 <8.0.0'

shamefullyHoist: true
