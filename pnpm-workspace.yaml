allowBuilds:
  '@swc/core': true
  # @opencode-ai/plugin is a type-only devDependency (OpenCode runs its own plugin
  # host); its transitive native accelerator never needs to build here.
  msgpackr-extract: false
  unrs-resolver: true

# Supply-chain gate (rm-133): block packages published less than 1440 minutes
# (1 day) ago — stops same-day compromise pushes while keeping weekly
# dependabot PRs mergeable. Set deliberately (the gate is inert without this
# key); the @bfra.me excludes below stay because those config packages are
# first-party pins that sometimes need same-day adoption.
minimumReleaseAge: 1440

# rm-196 rider (2026-09-25): hono@4.13.9 and vite@8.3.1 are the rider targets,
# both past their 1440-minute maturity timestamps — an explicit, disclosed
# bypass of the rm-133 age gate, not a weakening of it.
minimumReleaseAgeExclude:
  - '@bfra.me/eslint-config@0.51.2 || 0.51.3 || 0.51.4 || 0.52.0 || 0.52.1 || 0.52.2'
  - '@bfra.me/tsconfig@0.13.2'
  - hono@4.13.9
  - vite@8.3.1

overrides:
  brace-expansion@2: '>=2.1.2 <3.0.0'
  brace-expansion@5: '>=5.0.7 <6.0.0'
  fast-uri@3: '>=3.1.5 <4.0.0'
  toml: '>=4.2.0'
  undici@7: '>=7.29.0 <8.0.0'

shamefullyHoist: true
