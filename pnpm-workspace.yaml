allowBuilds:
  '@swc/core': true
  # @opencode-ai/plugin is a type-only devDependency (OpenCode runs its own plugin
  # host); its transitive native accelerator never needs to build here.
  msgpackr-extract: false
  unrs-resolver: true

# Supply-chain gate (rm-133): block packages published less than 1440 minutes
# (1 day) ago — stops same-day compromise pushes while keeping weekly
# dependabot PRs mergeable. Set deliberately (the gate is inert without this
# key); the @bfra.me excludes below stay because those config packages are
# first-party pins that sometimes need same-day adoption.
minimumReleaseAge: 1440

# 2026-10-05 (run cfa9f94b cycle 3, unfreeze batch B2): pnpm 11.x
# auto-installs dependencies when a script runs against a stale tree and
# silently REWRITES pnpm-lock.yaml in place — observed live on 2026-10-05
# across sibling runs (a fresh clone's first `pnpm <script>` dirtied the
# tracked lockfile; A/B control: with this key present a script run leaves
# the lockfile byte-identical, without it the rewrite lands). `pnpm config
# get verify-deps-before-run` misleadingly prints undefined — THIS
# camelCase workspace key is the honored form. CI is unaffected: gates run
# explicit frozen installs and this key only governs `pnpm run`-family
# commands. Revisit at the pnpm 12 bump (rm-140) — re-evaluate 12's default
# before carrying it forward.
verifyDepsBeforeRun: false

# rm-196 rider (2026-09-25): hono@4.13.9 and vite@8.3.1 are the rider targets
# — an explicit, disclosed bypass of the rm-133 age gate, not a weakening of
# it. Truth note (run 5ae8aaf72d8f, B3): at the rider merge (828a1e6,
# 2026-09-25T11:18:36Z) hono@4.13.9 was ~33h past its 1440-minute maturity,
# but vite@8.3.1 (published 2026-09-24T12:26Z) was ~68 minutes SHORT — the
# exclude was load-bearing for vite at merge time. Both are past maturity as
# of 2026-09-25T12:26Z; the entry remains as the dated bypass record.
# 2026-10-03 integrate (run 23d39aa7 landing): the hono@4.13.9 entry retired
# — the security refresh to hono 4.13.11 + @hono/node-server 2.1.3 is landed
# (rm-285; that batch's fast-uri floor cure DID close the two live HIGH
# alerts #29/#30 on 2026-10-03, but the lockfile half was reverted next day
# by the 1e1e2f5 upstream merge — #29/#30 re-opened 15:47:15Z; the lockfile
# reconcile rides the 2026-10-05 unfreeze batch, rm-285's correction rider),
# so the name was a dead bypass record; the retirement is rm-277's acceptance
# rider (rm-271's 2026-09-30 note).
# vite@8.3.1 stays (both rider targets past maturity; the record remains dated).
minimumReleaseAgeExclude:
  - '@bfra.me/eslint-config@0.51.2 || 0.51.3 || 0.51.4 || 0.52.0 || 0.52.1 || 0.52.2 || 0.54.0'
  - '@bfra.me/tsconfig@0.13.2'
  - vite@8.3.1

overrides:
  # rm-276 (2026-09-30, cycle 2): every floor now sits at/above its patched
  # line — an override floor does NOT force re-resolution off an
  # already-satisfying version, so a floor below the patched line pins the
  # advisory open (proven live by Dependabot alerts #29/#30 staying open with
  # security updates enabled). brace-expansion is dev-transitive via the
  # ESLint lint chain; the binding advisory on the v2 line is GHSA-q2hr-2g5m-vwhr
  # (moderate, patched 2.1.7) — the highs GHSA-qhr7-859c-m2p7 (2.1.6) and
  # GHSA-6j4f-fj2g-mc7p (2.1.5) are covered with headroom.
  brace-expansion@2: '>=2.1.7 <3.0.0'
  # Same three advisories on the v5 line (5.0.12 moderate binding; highs
  # 5.0.11/5.0.10 covered) — 5.0.12 is the patched line that covers all.
  brace-expansion@5: '>=5.0.12 <6.0.0'
  # fast-uri is dev-transitive via ajv@8 in the eslint lint chain;
  # GHSA-qw65-cvwx-89v3 + GHSA-58mr-gqgx-xq4g (both high; Dependabot alerts
  # #30/#29) patch at 3.1.7, GHSA-hrr3-gc8f-f4qj (moderate) forces 3.1.8 —
  # the fleet-cycle-20 restatement (formerly rm-282, renumbered rm-499 at
  # this integrate; see the INTEGRATE-MERGE comment in ROADMAP.md) adds
  # that 3.1.6 was the vulnerable line the prior >=3.1.5 floor admitted
  # (fro-bot/dashboard PR #538), already covered by this >=3.1.8 floor.
  fast-uri@3: '>=3.1.8 <4.0.0'
  # GHSA-82x6-q7mm-w9cf — toml is dev-transitive via
  # @opencode-ai/plugin>effect; >=4.2.0 is the patched line
  # (rescued by content from run b4aac9ba / PR #82 via cycle-13;
  # the batch's internal rm-171 numbering collided with landed ids).
  toml: '>=4.2.0'
  # All ten npm-DB undici advisories patch at >=7.29.1 (highs
  # GHSA-rfgv-xxqx-mfg5 + GHSA-w293-vg96-wgc3); the floor deliberately takes
  # the published 7.x tip 7.30.0, not the bare minimum. 7.29.1 itself sits in
  # NO indexed advisory's vulnerable range (verified 2026-10-01: GitHub's
  # advisory DB indexes 46 undici records, none containing 7.29.1 or 7.30.0)
  # and the npm backports 7.30.1/7.31.1 are unpublished, so the weekly audit
  # gate (.github/workflows/audit.yaml, rm-278) going red on any 7.x means a
  # NEWLY indexed advisory BY DESIGN and the undici 8 + jsdom 30 migration
  # rides rm-271's majors window. undici is dev-transitive via jsdom.
  undici@7: '>=7.30.0 <8.0.0'
  # 2026-10-06 (run cfa9f94b review_fix 8319b391 — independent review
  # finding 1 fold): source-map-js is dev-transitive on 16 build/lint paths
  # (@eslint/css-tree, @tailwindcss/*, vite>postcss); GHSA-68fv-2mgg-jv7q
  # (high, published 2026-09-18, indexed into the audit DB only between
  # 2026-10-05 and 2026-10-06) vulns >=1.0.0 <1.2.2 — this batch's recorded
  # 2026-10-05 audit-zero predates the indexing, so the floor re-establishes
  # it: >=1.2.2 is the patched line and the tip (published 2026-09-30,
  # minimumReleaseAge-mature).
  source-map-js: '>=1.2.2 <2.0.0'
  # 2026-10-06 (same fix): katex is lint-chain-only via
  # @bfra.me/eslint-config>@eslint/markdown>micromark-extension-math@3.1.0
  # (declares ^0.16.0); GHSA-238p-pmpm-9mq7 (low, published
  # 2026-10-05T23:41:05Z — 19 min before this batch's full_tests launch)
  # vulns >=0.11.0 <0.18.2, patched 0.18.2. The floor deliberately crosses
  # the depender's declared ^0.16 range (override semantics) and holds below
  # the 0.19 major: katex is inert at lint time in this repo (zero math
  # fences in repo markdown, verified 2026-10-06), lint+tests green on the
  # forced resolution. Lesson encoded at rm-285: recorded audit greens expire
  # with the advisory DB — re-derive at every fold.
  katex: '>=0.18.2 <0.19.0'

shamefullyHoist: true
